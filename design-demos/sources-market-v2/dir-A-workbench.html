<!doctype html>
<html lang="zh-CN" data-theme="default" data-color-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heron 苍鹭 · 来源与市场 A — 双栏工作台</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ Heron 真实 token：暖纸浅色（data-theme=default + light），逐字取自 ui/src/style.css ============ */
:root{
  --h-bg:#f3efe4;--h-panel:#fbf7ee;--h-raised:#ebe4d4;--h-line:#e3dbcc;--h-line2:#d3c9b8;
  --h-text:#2a2924;--h-dim:#5d574c;--h-faint:#7a7368;--h-ink:#fbf7ee;
  --h-good:#5c7a2e;--h-warn:#8a6216;--h-bad:#a8452f;
  --h-accent:#2f5b48;--h-accent-weak:rgba(47,91,72,.1);
  --h-shadow:0 12px 32px rgba(42,41,36,.12);
  --h-lift:0 1px 4px rgba(42,41,36,.06),0 6px 18px -8px rgba(42,41,36,.18);
  --h-radius:10px;--h-radius-sm:7px;
  --h-sans:"Manrope",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --h-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --h-serif:"EB Garamond","Songti SC",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--h-bg);color:var(--h-text);overflow:hidden;font-size:14px}
h1,h2,h3,p,dl,dd{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;line-height:normal}
button:disabled{opacity:.45;cursor:default}
input,textarea{font:inherit;color:var(--h-text)}
a{color:var(--h-accent)}
*:focus-visible{outline:2px solid var(--h-accent);outline-offset:1px}
*{scrollbar-width:thin;scrollbar-color:var(--h-line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background-color:var(--h-line2);border:3px solid transparent;border-radius:999px;background-clip:padding-box;min-height:36px}
::-webkit-scrollbar-thumb:hover{background-color:var(--h-faint)}

.h-body{background:var(--h-bg);color:var(--h-text);font-family:var(--h-sans);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}

/* ============ 外壳：左栏 + 顶栏（与 scan-overview-v2 同一套骨架） ============ */
.h-shell{display:grid;grid-template-columns:212px minmax(0,1fr);height:100vh;overflow:hidden}
.h-rail{display:flex;flex-direction:column;min-height:0;background:var(--h-panel);border-right:1px solid var(--h-line);padding:0 10px 10px}
.h-rail-head{display:flex;align-items:center;gap:9px;padding:15px 6px 12px}
.h-seal{width:25px;height:25px;border-radius:5px;background:var(--h-accent);color:var(--h-ink);display:grid;place-items:center;flex:none}
.h-seal svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
.h-wordmark{display:flex;flex-direction:column;line-height:1.12}
.h-wordmark b{font-family:var(--h-serif);font-size:16px;font-weight:600;letter-spacing:.01em}
.h-wordmark small{font-size:12px;color:var(--h-dim);letter-spacing:.08em}
.h-search{display:flex;align-items:center;gap:8px;height:32px;padding:0 9px;margin:2px 0 10px;border:1px solid var(--h-line);border-radius:7px;color:var(--h-dim);font-size:12px;background:var(--h-raised)}
.h-search kbd{margin-left:auto;font-family:var(--h-mono);font-size:12px;color:var(--h-dim);border:1px solid var(--h-line2);border-radius:4px;padding:1px 4px}
.h-rail-scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:1px}
.h-group{font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--h-dim);padding:14px 8px 6px}
.h-nav{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:6px;font-size:12.5px;color:var(--h-dim);position:relative;text-align:left;width:100%}
.h-nav svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5}
.h-nav:hover{background:var(--h-raised);color:var(--h-text)}
.h-nav.is-active{background:var(--h-accent-weak);color:var(--h-accent);font-weight:600}
.h-nav.is-active::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--h-accent)}
.h-count{margin-left:auto;font-family:var(--h-mono);font-size:12px;color:var(--h-dim);min-width:16px;text-align:right;font-variant-numeric:tabular-nums}
.h-count.tone-warn{color:var(--h-warn)}.h-count.tone-bad{color:var(--h-bad)}
.h-rail-foot{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--h-line)}
.h-health{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:0 4px}
.h-hdot{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--h-dim)}
.h-hdot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--h-faint)}
.h-hdot.good::before{background:var(--h-good)}.h-hdot.warn::before{background:var(--h-warn)}.h-hdot.bad::before{background:var(--h-bad)}
.h-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.h-topbar{display:flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-bottom:1px solid var(--h-line);flex:none;background:var(--h-bg);position:relative;z-index:5}
.h-crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--h-faint);white-space:nowrap;overflow:hidden}
.h-crumbs b{color:var(--h-text);font-weight:600}
.h-topbar .sp{flex:1}
.h-view{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 24px 18px;overflow:hidden}

/* ============ 原子件：按钮 / chip / 表格 / 卡片 ============ */
.h-btn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:var(--h-radius-sm);
  border:1px solid var(--h-line2);font-size:12.5px;font-weight:500;color:var(--h-text);white-space:nowrap}
.h-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none}
.h-btn:hover{background:var(--h-raised)}
.h-btn.primary{background:var(--h-text);border-color:var(--h-text);color:var(--h-bg)}
.h-btn.primary:hover{opacity:.88;background:var(--h-text)}
.h-btn.ghost{border-color:transparent;color:var(--h-dim)}
.h-btn.ghost:hover{background:var(--h-raised);color:var(--h-text)}
.h-btn.sm{height:26px;padding:0 9px;font-size:12px}
.h-btn.xs{height:22px;padding:0 8px;font-size:12px;gap:5px}
.h-btn.danger{color:var(--h-bad);border-color:transparent}
.h-btn.danger:hover{background:color-mix(in srgb,var(--h-bad) 12%,transparent);color:var(--h-bad)}
.i{display:inline-flex;align-items:center}.i svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5}
.h-chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;
  font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.h-chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.h-chip.good{color:var(--h-good);background:color-mix(in srgb,var(--h-good) 12%,transparent)}
.h-chip.warn{color:var(--h-warn);background:color-mix(in srgb,var(--h-warn) 12%,transparent)}
.h-chip.bad{color:var(--h-bad);background:color-mix(in srgb,var(--h-bad) 12%,transparent)}
.h-chip.neutral{color:var(--h-dim);background:var(--h-raised);border-color:var(--h-line)}
.h-chip.accent{color:var(--h-accent);background:var(--h-accent-weak)}
.h-chip.plain::before{display:none}
.h-chip.sm{height:19px;padding:0 7px;font-size:12px;gap:4px}
.h-mono{font-family:var(--h-mono);font-size:12px;color:var(--h-dim);font-variant-numeric:tabular-nums}
.h-path{font-family:var(--h-mono);font-size:12px;color:var(--h-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr}
.h-muted{color:var(--h-dim)}
.h-h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.h-lead{margin-top:5px;color:var(--h-dim);font-size:14px}
.h-view-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;flex:none;margin-bottom:14px}
.h-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.h-card{background:var(--h-panel);border:1px solid var(--h-line);border-radius:var(--h-radius)}
.h-card-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--h-line)}
.h-card-h h3{font-size:12.5px;font-weight:600;letter-spacing:.02em}
.h-card-h .r{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--h-dim)}
.h-table{width:100%;border-collapse:separate;border-spacing:0}
.h-table th{text-align:left;font-size:12px;font-weight:600;color:var(--h-dim);padding:0 12px 8px;border-bottom:1px solid var(--h-line);white-space:nowrap}
.h-table td{padding:9px 12px;border-bottom:1px solid var(--h-line);font-size:12.5px;vertical-align:middle}
.h-table tbody tr:last-child td{border-bottom:0}
.h-table td.num{font-family:var(--h-mono);font-size:12px;color:var(--h-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.h-table td.acts{text-align:right;white-space:nowrap}
.h-empty{padding:34px 16px;text-align:center;color:var(--h-dim);font-size:13px}
.h-input{height:32px;padding:0 10px;border:1px solid var(--h-line2);border-radius:var(--h-radius-sm);
  background:var(--h-raised);color:var(--h-text);font-size:14px;outline:none;width:100%}
.h-input:focus{border-color:var(--h-text);background:var(--h-panel)}
.h-input.mono{font-family:var(--h-mono);font-size:12px}
.h-seg{display:inline-flex;border:1px solid var(--h-line2);border-radius:var(--h-radius-sm);overflow:hidden;background:var(--h-panel)}
.h-seg button{height:28px;padding:0 12px;font-size:12.5px;color:var(--h-dim);display:inline-flex;align-items:center;gap:6px}
.h-seg button+button{border-left:1px solid var(--h-line)}
.h-seg button.is-active{background:var(--h-text);color:var(--h-bg);font-weight:600}
.h-seg .n{font-family:var(--h-mono);font-size:12px;opacity:.75}
.h-switch{position:relative;width:30px;height:17px;border-radius:999px;background:var(--h-line2);cursor:pointer;flex:none;transition:background .15s}
.h-switch::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--h-panel);transition:transform .15s;box-shadow:0 1px 2px rgba(42,41,36,.3)}
.h-switch.on{background:var(--h-accent)}
.h-switch.on::after{transform:translateX(13px)}
.h-dot{position:relative;display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--h-faint);flex:none}
.h-dot.visible{background:var(--h-good)}
.h-dot.shadowed{background:var(--h-warn)}
.h-dot.broken{background:var(--h-bad)}
.h-dot.not_scanned{background:transparent;box-shadow:inset 0 0 0 1.5px var(--h-line2)}
/* ============ A · 双栏工作台 ============ */
.wb{display:grid;grid-template-columns:274px minmax(0,1fr);gap:14px;flex:1;min-height:0}
@media (max-width:1080px){ .wb{grid-template-columns:238px minmax(0,1fr)} }
.wb>section{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.pane-h{display:flex;align-items:center;gap:9px;height:38px;padding:0 13px;border-bottom:1px solid var(--h-line);flex:none}
.pane-h h3{font-size:12.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.pane-h .r{margin-left:auto;display:flex;align-items:center;gap:8px}
.pane-b{flex:1;min-height:0;overflow:auto}
.pane-f{flex:none;border-top:1px solid var(--h-line);padding:9px 13px;display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--h-raised) 45%,var(--h-panel))}
.pane-f .h-input{flex:1 1 auto;min-width:0;width:auto}

/* 左：来源列表（可勾选启停 + 健康探针的活列表） */
.src{position:relative;display:flex;flex-direction:column;gap:6px;padding:10px 12px 10px 13px;border-bottom:1px solid var(--h-line);text-align:left;width:100%;cursor:pointer}
.src:last-child{border-bottom:0}
.src:hover{background:var(--h-raised)}
.src.is-sel{background:var(--h-accent-weak)}
.src.is-sel::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--h-accent)}
.src.is-off .s-name,.src.is-off .s-sub{opacity:.5}
.s-l1{display:flex;align-items:center;gap:8px;min-width:0}
.s-name{font-size:14px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-ver{font-family:var(--h-mono);font-size:12px;color:var(--h-faint);margin-left:auto;flex:none}
.s-l1 .h-switch{margin-left:auto;flex:none}
.s-ver+.h-switch{margin-left:8px}
.s-l2{display:flex;align-items:center;gap:7px;min-width:0}
.s-l2 .h-chip{flex:none}
.s-host{font-family:var(--h-mono);font-size:12px;color:var(--h-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-idx{margin-left:auto;flex:none;font-family:var(--h-mono);font-size:12px;color:var(--h-faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.s-idx.unk{color:color-mix(in srgb,var(--h-faint) 72%,transparent)}
.src .s-note{font-size:12px;color:var(--h-dim);line-height:1.45}
.wb-foot{flex:none;padding:0 13px;height:34px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--h-line);font-size:12px;color:var(--h-faint)}
.wb-foot .h-btn{margin-left:auto}

/* 右：内容区 */
.p-head{flex:none;padding:14px 16px 12px;border-bottom:1px solid var(--h-line);display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.p-title{display:flex;align-items:center;gap:9px;min-width:0}
.p-title h2{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.p-title .h-dot{margin-right:1px}
.p-sub{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap;font-size:12.5px;color:var(--h-dim)}
.p-ctl{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.p-body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
.row-search{display:flex;align-items:center;gap:8px}
.row-search .h-input{max-width:420px}
.hint{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border:1px solid var(--h-line);
  border-radius:var(--h-radius-sm);background:color-mix(in srgb,var(--h-warn) 7%,var(--h-panel));font-size:13.5px;color:var(--h-dim);line-height:1.55}
.hint.accent{background:color-mix(in srgb,var(--h-accent) 6%,var(--h-panel));border-color:color-mix(in srgb,var(--h-accent) 22%,var(--h-line))}
.hint svg{width:15px;height:15px;stroke:var(--h-warn);fill:none;stroke-width:1.6;flex:none;margin-top:1px}
.hint.accent svg{stroke:var(--h-accent)}
.hint b{color:var(--h-text);font-weight:600}
.hint code{font-family:var(--h-mono);font-size:12px;color:var(--h-text);background:var(--h-raised);padding:1px 5px;border-radius:4px}
.r-name{font-family:var(--h-mono);font-size:14px;font-weight:600;color:var(--h-text)}
.r-owner{font-family:var(--h-mono);font-size:12px;color:var(--h-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}
.r-sum{font-size:14px;color:var(--h-dim);line-height:1.5;max-width:460px}
.r-inst{font-family:var(--h-mono);font-size:12px;color:var(--h-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.r-inst .k{color:var(--h-accent)}

/* 收藏卡网格 */
.favgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.fav{display:flex;flex-direction:column;gap:9px;padding:12px 13px;background:var(--h-panel);border:1px solid var(--h-line);border-radius:var(--h-radius);transition:border-color .15s,box-shadow .15s}
.fav:hover{border-color:var(--h-line2);box-shadow:var(--h-lift)}
.f-top{display:flex;align-items:center;gap:8px;min-width:0}
.f-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-top .h-chip{margin-left:auto;flex:none}
.f-desc{font-size:14px;color:var(--h-dim);line-height:1.55;min-height:42px}
.f-url{display:flex;align-items:center;gap:7px;min-width:0}
.f-url .h-path{flex:1;min-width:0;color:var(--h-text)}
.f-foot{display:flex;align-items:center;gap:7px;padding-top:9px;border-top:1px solid var(--h-line)}
.f-foot .added{font-family:var(--h-mono);font-size:12px;color:var(--h-faint)}
.f-foot .h-btn{margin-left:0}
.f-foot .sp{flex:1}
.addform{display:flex;flex-direction:column;gap:10px;padding:12px 13px;border:1px dashed var(--h-line2);border-radius:var(--h-radius);background:color-mix(in srgb,var(--h-raised) 40%,var(--h-panel))}
.addform .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:10px}
.fl{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--h-dim);min-width:0}

/* 来源能力对照（紧凑，回答“这个来源到底怎么用”） */
.capgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--h-line);
  border-radius:var(--h-radius-sm);overflow:hidden;background:color-mix(in srgb,var(--h-raised) 32%,var(--h-panel))}
.cap{padding:9px 12px;min-width:0}
.cap+.cap{border-left:1px solid var(--h-line)}
.cap dt{font-size:12px;color:var(--h-faint);letter-spacing:.02em;white-space:nowrap}
.cap dd{margin:4px 0 0;font-size:12.5px;color:var(--h-text);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap dd.mono{font-family:var(--h-mono);font-size:12px;color:var(--h-dim)}
@media (max-width:1180px){ .capgrid{grid-template-columns:repeat(2,minmax(0,1fr))} .cap:nth-child(n+3){border-top:1px solid var(--h-line)} .cap:nth-child(3){border-left:0} }

/* toast */
.h-toasts{position:fixed;right:22px;bottom:22px;z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.h-toast{pointer-events:auto;display:flex;align-items:flex-start;gap:10px;max-width:min(440px,calc(100vw - 44px));
  padding:10px 10px 10px 11px;border-radius:10px;font-size:12.5px;line-height:1.5;
  background:var(--h-panel);border:1px solid var(--h-line2);border-left:3px solid var(--h-good);box-shadow:var(--h-shadow)}
.h-toast.tone-warn{border-left-color:var(--h-warn)}
.h-toast.tone-bad{border-left-color:var(--h-bad)}
.h-toast .ti{width:20px;height:20px;border-radius:6px;flex:none;display:grid;place-items:center;margin-top:-1px;
  background:color-mix(in srgb,var(--h-good) 14%,transparent);color:var(--h-good)}
.h-toast.tone-warn .ti{background:color-mix(in srgb,var(--h-warn) 14%,transparent);color:var(--h-warn)}
.h-toast.tone-bad .ti{background:color-mix(in srgb,var(--h-bad) 14%,transparent);color:var(--h-bad)}
.h-toast .ti svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.h-toast .tt{flex:1;min-width:0;overflow-wrap:anywhere;padding-top:1px}
.h-toast .tt b{font-family:var(--h-mono);font-size:12px;font-weight:600}
.h-toast .ta{flex:none;align-self:center;height:24px;padding:0 9px;border:1px solid var(--h-line2);border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap}
.h-toast .ta:hover{background:var(--h-raised)}
.h-toast .x{width:22px;height:22px;border-radius:6px;flex:none;display:grid;place-items:center;color:var(--h-faint)}
.h-toast .x:hover{background:var(--h-raised);color:var(--h-text)}

              <table v-else class="h-table">
                <thead><tr>
                  <th style="width:230px">网页条目</th><th>说明</th><th style="width:300px">条目地址</th><th style="width:110px" class="acts">操作</th>
                </tr></thead>
                <tbody>
                  <tr v-for="r in shown" :key="r.name">
                    <td><div class="r-name">{{ r.name }}</div><div class="r-owner">{{ r.owner }}</div></td>
                    <td><div class="r-sum">{{ r.sum }}</div></td>
                    <td><div class="h-path" :title="r.url">{{ r.url }}</div></td>
                    <td class="acts">
                      <button class="h-btn sm" @click="openUrl(r.url,r.name)"><span class="i" v-html="ICON.external"></span>打开</button>
                    </td>
                  </tr>
                </tbody>
              </table>

              <div v-if="!shown.length" class="h-empty">
                {{ cur.name }} 没有匹配「{{ lastQ }}」的{{ cur.cap==='search'?'结果':'条目' }}。{{ cur.cap==='search'?'换个关键词，或改用下方粘贴地址安装。':'这个关键词只有网页里有，去浏览器看看。' }}
              </div>
              <div class="h-mono" v-if="shown.length" style="color:var(--h-faint)">
                示例数据：原型内置的假结果，字段与真实搜索结果一致；接入后由 <span v-pre>`search_market_source`</span> 返回。
              </div>

              <dl class="capgrid">
                <div class="cap"><dt>搜索通道</dt><dd>{{ cur.cap==='search'?(cur.id==='skills_sh'?'sitemap 解析':'API / 页面解析'):'无接口，仅拼深链' }}</dd></div>
                <div class="cap"><dt>安装通道</dt><dd>{{ cur.cap==='search'?'git clone --depth 1':'粘贴仓库地址后克隆' }}</dd></div>
                <div class="cap"><dt>深链模板</dt><dd class="mono">{{ linkTpl }}</dd></div>
                <div class="cap"><dt>上次探测</dt><dd class="mono">{{ probeAge }} · {{ healthText(cur) }}</dd></div>
              </dl>
            </div>

            <!-- ============ 我的收藏 ============ -->
            <div v-else class="p-body h-in" key="favs">
              <div class="row-search">
                <span class="h-muted" style="font-size:12.5px">收藏的是仓库地址本身，与当前来源 {{ cur.name }} 无关；安装时仍可改子目录与落点。</span>
                <button class="h-btn sm" style="margin-left:auto" @click="addOpen=!addOpen">
                  <span class="i" v-html="addOpen?ICON.x:ICON.plus"></span>{{ addOpen?'取消':'添加收藏' }}
                </button>
              </div>

              <div v-if="addOpen" class="addform h-in">
                <div class="grid">
                  <label class="fl">名称<input class="h-input" v-model.trim="nf.name" placeholder="pdf"></label>
                  <label class="fl">仓库地址（github / gitee）<input class="h-input mono" v-model.trim="nf.url" placeholder="https://github.com/owner/repo/tree/main/pdf"></label>
                </div>
                <label class="fl">描述<input class="h-input" v-model.trim="nf.desc" placeholder="一句话说明这个 Skill 干什么用"></label>
                <div style="display:flex;align-items:center;gap:8px">
                  <span class="h-mono">安装仍走 git clone · 浅克隆 --depth 1</span>
                  <button class="h-btn primary sm" style="margin-left:auto" @click="saveFav"><span class="i" v-html="ICON.check"></span>保存收藏</button>
                </div>
              </div>

              <div v-if="favs.length" class="favgrid">
                <article v-for="f in favs" :key="f.url" class="fav h-in">
                  <div class="f-top">
                    <span class="i" style="color:var(--h-dim)" v-html="ICON.star"></span>
                    <span class="f-name">{{ f.name }}</span>
                    <span class="h-chip sm plain" :class="f.state==='installed'?'good':'neutral'">{{ f.state==='installed'?('已装 '+f.ver):'未安装' }}</span>
                  </div>
                  <p class="f-desc">{{ f.desc }}</p>
                  <div class="f-url">
                    <span class="i" style="color:var(--h-faint)" v-html="ICON.branch"></span>
                    <span class="h-path" :title="f.url">{{ f.url }}</span>
                    <span class="h-chip sm neutral plain">{{ f.host }}</span>
                  </div>
                  <div class="f-foot">
                    <button class="h-btn primary sm" @click="installFav(f)"><span class="i" v-html="ICON.download"></span>{{ f.state==='installed'?'重新安装':'一键安装' }}</button>
                    <button class="h-btn ghost sm" @click="openUrl(f.url,f.name)"><span class="i" v-html="ICON.external"></span>打开</button>
                    <button class="h-btn ghost sm danger" @click="removeFav(f)"><span class="i" v-html="ICON.trash"></span>移除</button>
                    <span class="sp"></span>
                    <span class="added">收藏于 {{ f.added }}</span>
                  </div>
                </article>
              </div>
              <div v-else class="h-empty">还没有收藏。点右上「添加收藏」，或在市场结果里把仓库地址粘到底部安装时顺带收藏。</div>
            </div>
          </div>

          <!-- 底部常驻：粘贴 Git 地址安装 -->
          <div class="pane-f">
            <span class="h-mono" style="flex:none;color:var(--h-faint)">粘贴 Git 地址安装</span>
            <input class="h-input mono" v-model.trim="pasteUrl" @keyup.enter="installPaste"
                   placeholder="https://github.com/owner/repo（可带 /tree/分支/子目录，也支持 gitee.com）">
            <button class="h-btn sm" @click="previewPaste"><span class="i" v-html="ICON.eyes"></span>预览</button>
            <button class="h-btn primary sm" @click="installPaste"><span class="i" v-html="ICON.download"></span>安装</button>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>

<!-- ============ Toast：右下角瞬时反馈 ============ -->
<div class="h-toasts">
  <transition-group name="toast">
    <div v-for="t in toasts" :key="t.id" class="h-toast" :class="'tone-'+t.tone">
      <span class="ti" v-html="t.tone==='bad'?ICON.x:(t.tone==='warn'?ICON.alert:ICON.check)"></span>
      <span class="tt" v-html="t.text"></span>
      <button v-if="t.action" class="ta" @click="runAction(t)">{{ t.action }}</button>
      <button class="x" @click="dismiss(t.id)" aria-label="关闭提示"><span v-html="ICON.x"></span></button>
    </div>
  </transition-group>
</div>
</div>
</script>
<script type="module">
import { createApp, reactive, computed, ref, toRefs } from 'https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.esm-browser.prod.js';
document.body.innerHTML = document.getElementById('tpl').innerHTML;

const NAV = [
  {group:'工作台', items:[{id:'overview', label:'概览', icon:'overview'}]},
  {group:'收集 · 分发', items:[
    {id:'library', label:'我的 Skill', icon:'library', count:'20 待管'},
    {id:'discover', label:'发现', icon:'discover', count:'2.6k'},
    {id:'sources', label:'来源与市场', icon:'sources'}
  ]},
  {group:'维护', items:[
    {id:'upgrades', label:'更新', icon:'upgrades', count:'8'},
    {id:'doctor', label:'体检', icon:'doctor', count:'20', tone:'bad'},
    {id:'projects', label:'项目与落点', icon:'projects', count:'3'},
    {id:'settings', label:'设置', icon:'settings'}
  ]}
];
const HEALTH_TEXT = {
  visible:'探测正常 · 240ms',
  shadowed:'偏慢 / 部分超时',
  broken:'探测失败 · HTTP 403',
  not_scanned:'未启用，跳过探测'
};
const esc = v => String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cloneable = u => /^https?:\/\/[^/]*\b(github|gitee)\.[^/]+\/[^/]+\/[^/?#]+/i.test(u) || /^https?:\/\/.+\.git$/i.test(u);

function parseGitUrl(raw){
  const url = (raw||'').trim().replace(/\.git$/,'');
  const m = url.match(/^https?:\/\/([^/]+)\/([^/]+)\/([^/?#]+)(?:\/tree\/[^/]+\/(.+))?$/i);
  if(!m) return null;
  return { host:m[1], owner:m[2], name:m[3], sub:m[4]||null, url };
}

createApp({
  setup(){
    const s = reactive({
      sources: SOURCES, favs: FAVS.map(f => ({...f})),
      curId:'skills_sh', pane:'market',
      q:'', lastQ:'', busy:false, done:{},
      pasteUrl:'', addOpen:false, nf:{name:'',url:'',desc:''},
      probeAge:'3 分钟前', probing:false, unmanaged:20
    });
    const toasts = ref([]);
    let tid = 0;
    /* 原型深链：#src=qoder&pane=favs&q=pdf —— 方便逐屏核对，不影响默认视图 */
    const hs = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    if(hs.get('src') && SOURCES.some(x => x.id === hs.get('src'))) s.curId = hs.get('src');
    if(hs.get('pane') === 'favs') s.pane = 'favs';
    if(hs.get('q')) { s.q = hs.get('q'); s.lastQ = hs.get('q'); }
    if(hs.get('toast')) setTimeout(() => install(RESULTS[s.curId][0]), 200);

    const cur = computed(() => s.sources.find(x => x.id === s.curId));
    const base = computed(() => cur.value.cap === 'search' ? (RESULTS[cur.value.id] || []) : (WEB_RESULTS[cur.value.id] || []));
    const shown = computed(() => {
      const kw = s.lastQ.toLowerCase();
      if(!kw) return base.value;
      return base.value.filter(r => ((r.name||'') + ' ' + (r.owner||'') + ' ' + (r.sum||'')).toLowerCase().includes(kw));
    });
    const marketCount = computed(() => base.value.length);
    const onCount = computed(() => s.sources.filter(x => x.on).length);
    const installedHere = computed(() => Object.keys(s.done).filter(k => k.startsWith(cur.value.id + '::')));
    const webLink = computed(() => cur.value.url + '?q=' + (s.q || '关键词'));
    const linkTpl = computed(() => cur.value.cap === 'web' ? cur.value.url + '?q=关键词' : cur.value.url + '/<owner>/<repo>');
    const searchPlaceholder = computed(() => cur.value.cap === 'search'
      ? '在 ' + cur.value.name + ' 搜索 Skill 关键词，回车即搜'
      : '输入关键词，Heron 会拼成 ' + cur.value.name + ' 的网页搜索地址');

    function dismiss(id){ const i = toasts.value.findIndex(t => t.id === id); if(i > -1) toasts.value.splice(i,1); }
    function say(tone, text, action, cb){
      const t = { id: ++tid, tone, text, action: action || '' };
      if(cb) t.cb = cb;
      toasts.value.push(t);
      setTimeout(() => dismiss(t.id), tone === 'ok' ? 5200 : 6400);
    }
    function runAction(t){ if(t.cb) t.cb(); dismiss(t.id); }

    const keyOf = r => cur.value.id + '::' + r.name;
    const isDone = r => !!s.done[keyOf(r)];

    function pick(id){ s.curId = id; s.q = ''; s.lastQ = ''; }
    function toggle(src){
      src.on = !src.on;
      if(!src.on) src.health = 'not_scanned';
      else src.health = src.id === 'modelscope' || src.id === 'skillhub_cn' ? 'shadowed' : 'visible';
      say(src.on ? 'ok' : 'warn', src.on
        ? '已启用 <b>' + esc(src.name) + '</b>，下次搜索纳入它'
        : '已停用 <b>' + esc(src.name) + '</b>，本次会话不再向它发请求');
    }
    function reprobe(){
      if(s.probing) return;
      s.probing = true;
      setTimeout(() => {
        s.probing = false; s.probeAge = '刚刚';
        const ok = s.sources.filter(x => x.on && x.health === 'visible').length;
        const slow = s.sources.filter(x => x.on && x.health === 'shadowed').length;
        say('ok', '探测完成：' + ok + ' 正常 · ' + slow + ' 偏慢 · ' + (s.sources.length - ok - slow) + ' 未探测');
      }, 680);
    }
    function runSearch(){
      if(s.busy) return;
      s.busy = true;
      const kw = s.q;
      setTimeout(() => {
        s.busy = false; s.lastQ = kw;
        if(cur.value.cap === 'web')
          say('warn', '已按关键词拼好深链：<b>' + esc(webLink.value) + '</b>（该来源无搜索接口）');
        else
          say('ok', '<b>' + esc(cur.value.name) + '</b> 返回 ' + shown.value.length + ' 条结果' + (kw ? '（关键词 ' + esc(kw) + '）' : '（默认目录）'));
      }, 420);
    }
    function openUrl(url, name){
      say('warn', '将在默认浏览器打开' + (name ? ' <b>' + esc(name) + '</b>：' : '：') + esc(url) + '，Heron 不会抓取该页面');
    }
    function preview(r){
      say('ok', '预览（--dry-run）：<b>git clone --depth 1 ' + esc(r.git) + '</b> → <b>~/.heron/store/' + esc(r.name) + '</b>'
        + (r.sub ? ' · 只取子目录 ' + esc(r.sub) : ''));
    }
    function install(r){
      s.done[keyOf(r)] = true;
      say('ok', '<b>' + esc(r.name) + ' ' + esc(r.ver) + '</b> 已安装到存储区 <b>~/.heron/store/' + esc(r.name) + '</b>',
        '在存储区查看', () => say('warn', '原型不跳转：实现里会切到「我的 Skill → 存储区」并选中该 Skill'));
    }
    function installFav(f){
      f.state = 'installed'; if(!f.ver) f.ver = '1.0.0';
      say('ok', '<b>' + esc(f.name) + '</b> 已从 ' + esc(f.host) + ' 安装：' + (f.sub ? '子目录 ' + esc(f.sub) + ' → ' : '') + '<b>~/.heron/store/' + esc(f.name) + '</b>');
    }
    function removeFav(f){
      const i = s.favs.findIndex(x => x.url === f.url);
      const bak = s.favs[i];
      s.favs.splice(i, 1);
      say('warn', '已移除收藏 <b>' + esc(f.name) + '</b>，存储区与项目软链不动', '撤销', () => s.favs.splice(i, 0, bak));
    }
    function saveFav(){
      const p = parseGitUrl(s.nf.url);
      if(!p) return say('bad', '收藏地址看起来不是仓库：<b>https://github.com/owner/repo</b> 或 gitee 地址');
      const name = s.nf.name || p.name;
      if(s.favs.some(f => f.url === p.url)) return say('bad', '这个地址已经在收藏里了');
      s.favs.unshift({ name, host:p.host, url:p.url, sub:p.sub, desc:s.nf.desc || '（未填写描述）', added:'2026-11-22', state:'absent', ver:null });
      s.nf = { name:'', url:'', desc:'' }; s.addOpen = false;
      say('ok', '已收藏 <b>' + esc(name) + '</b>（' + esc(p.host) + '），随时可一键安装');
    }
    function pastePlan(){
      const p = parseGitUrl(s.pasteUrl);
      if(!p) return null;
      const dir = p.sub || p.name;
      return { ...p, dir, target:'~/.heron/store/' + (p.sub ? p.sub.split('/').pop() : p.name) };
    }
    function previewPaste(){
      if(!cloneable(s.pasteUrl)) return say('bad', '粘贴的地址不是可克隆的 git 仓库（当前只支持 github / gitee）');
      const pl = pastePlan();
      say('ok', '预览（--dry-run）：<b>git clone --depth 1 ' + esc(pl.url || s.pasteUrl) + '</b> → <b>' + esc(pl.target) + '</b>');
    }
    function installPaste(){
      if(!cloneable(s.pasteUrl)) return say('bad', '粘贴的地址不是可克隆的 git 仓库（当前只支持 github / gitee）');
      const p = pastePlan();
      say('ok', '<b>' + esc(p.name) + '</b> 已按 ' + (p.sub ? '子目录 ' + esc(p.sub) : '整仓') + ' 安装到 <b>' + esc(p.target) + '</b>',
        '加入收藏', () => {
          if(s.favs.some(f => f.url === p.url)) return say('bad', '这个地址已经在收藏里了');
          s.favs.unshift({ name:p.name, host:p.host, url:p.url, sub:p.sub, desc:'从粘贴地址安装时收藏', added:'2026-11-22', state:'installed', ver:'1.0.0' });
          say('ok', '已加入收藏 <b>' + esc(p.name) + '</b>');
        });
    }

    return {
      ...toRefs(s), SOURCES: s.sources, ICON, NAV, HEALTH_TEXT, say,
      cur, shown, marketCount, onCount, installedHere, webLink, linkTpl, searchPlaceholder, toasts,
      healthText: x => HEALTH_TEXT[x.health] || '',
      isDone, pick, toggle, reprobe, runSearch, openUrl, preview, install,
      installFav, removeFav, saveFav, previewPaste, installPaste, dismiss, runAction
    };
  }
}).mount('body');
</script>
</body>
</html>
