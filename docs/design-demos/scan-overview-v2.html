<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heron · 扫描进度 + 概览改版 v2</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
:root{
  --h-bg:#090807;--h-panel:#0F0E0C;--h-raised:#151310;--h-line:rgba(246,240,230,.08);
  --h-line2:rgba(246,240,230,.16);--h-text:#EFE8DA;--h-dim:#C2BCB0;--h-faint:#A39B8C;
  --h-ink:#181410;--h-good:#B2C77A;--h-warn:#E3C08A;--h-bad:#E47B66;--h-vit:#9EA8FF;
  --h-sans:"Manrope",-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
  --h-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --h-serif:"EB Garamond","Songti SC",Georgia,serif;
  --h-lift:0 6px 18px rgba(0,0,0,.42);
  color-scheme:dark;
}
[data-theme="light"]{
  --h-bg:#FAF9F6;--h-panel:#FFFFFF;--h-raised:#F5F2EC;--h-line:#E8E3DA;--h-line2:#D6CFC3;
  --h-text:#211D18;--h-dim:#5C5650;--h-faint:#776F64;
  --h-ink:#FFFFFF;--h-good:#5C7A2E;--h-warn:#8A6216;--h-bad:#A8452F;--h-vit:#4B4BC2;
  --h-lift:0 6px 18px rgba(33,29,24,.14);
  color-scheme:light;
}
html,body{margin:0;padding:0;background:var(--h-bg);color:var(--h-text)}
.h-body{background:var(--h-bg);color:var(--h-text);font-family:var(--h-sans);overflow:hidden}
.h-shell{display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:1fr;height:100vh;overflow:hidden}
@media (max-width:880px){ .h-shell{grid-template-columns:1fr} }
[data-rail]{display:none}
@media (max-width:880px){ [data-rail]{display:none !important} }
/* rail */
.h-rail{display:flex;flex-direction:column;min-height:0;background:var(--h-panel);border-right:1px solid var(--h-line);padding:0 10px 10px}
.h-rail-head{display:flex;align-items:center;gap:9px;padding:15px 6px 12px}
.h-seal{width:25px;height:25px;border-radius:5px;background:var(--h-text);color:var(--h-bg);display:grid;place-items:center;flex:none}
.h-seal svg{width:15px;height:15px}
.h-wordmark{display:flex;flex-direction:column;line-height:1.12}
.h-wordmark b{font-family:var(--h-serif);font-size:16px;font-weight:600;letter-spacing:.01em}
.h-wordmark small{font-size:12px;color:var(--h-dim);letter-spacing:.08em}
.h-search{display:flex;align-items:center;gap:8px;height:32px;padding:0 9px;margin:2px 0 10px;border:1px solid var(--h-line);border-radius:7px;color:var(--h-dim);font-size:12px;background:var(--h-raised)}
.h-search kbd{margin-left:auto;font-family:var(--h-mono);font-size:12px;color:var(--h-dim);border:1px solid var(--h-line);border-radius:4px;padding:1px 4px}
.h-rail-scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:1px;scrollbar-width:thin}
.h-group{font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--h-dim);padding:14px 8px 6px}
.h-nav{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:6px;font-size:12.5px;color:var(--h-dim);position:relative;text-align:left;width:100%}
.h-nav svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5}
.h-nav:hover{background:var(--h-raised);color:var(--h-text)}
.h-nav.is-active{background:var(--h-raised);color:var(--h-text);font-weight:600}
.h-nav.is-active::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--h-vit)}
.h-count{margin-left:auto;font-family:var(--h-mono);font-size:12px;color:var(--h-dim);min-width:16px;text-align:right}
.h-count.tone-warn{color:var(--h-warn)} .h-count.tone-bad{color:var(--h-bad)}
.h-rail-foot{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--h-line)}
.h-health{display:flex;gap:7px;flex-wrap:wrap;padding:0 4px}
.h-dot{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--h-dim)}
.h-dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--h-faint)}
.h-dot.good::before{background:var(--h-good)} .h-dot.warn::before{background:var(--h-warn)} .h-dot.bad::before{background:var(--h-bad)}
.h-theme{margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border:1px solid var(--h-line);border-radius:999px;font-size:12px;color:var(--h-dim)}
.h-theme svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6}
.h-main{display:flex;flex-direction:column;min-width:0;min-height:0}
/* topbar */
.h-topbar{display:flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-bottom:1px solid var(--h-line);flex:none;background:var(--h-bg);z-index:5;position:relative}
.h-crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--h-faint);white-space:nowrap;overflow:hidden}
.h-crumbs b{color:var(--h-text);font-weight:600}
.h-topbar .sp{flex:1}
.h-btn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:7px;font-size:12.5px;font-weight:500;border:1px solid var(--h-line2);color:var(--h-text);white-space:nowrap}
.h-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.h-btn:hover{background:var(--h-raised)}
.h-btn.primary{background:var(--h-text);border-color:var(--h-text);color:var(--h-bg)}
.h-btn.primary:hover{opacity:.9}
.h-btn:disabled{opacity:.45;cursor:default}
.h-view{padding:24px 28px 46px;overflow:auto;flex:1;min-height:0;position:relative}
.h-view-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.h-h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.h-lead{margin:6px 0 0;color:var(--h-dim);font-size:14px}
.h-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* surfaces */
.h-card{background:var(--h-panel);border:1px solid var(--h-line);border-radius:10px}
.h-card-h{display:flex;align-items:center;gap:8px;padding:12px 15px;border-bottom:1px solid var(--h-line)}
.h-card-h h3{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.02em}
.h-card-h .r{margin-left:auto;display:flex;align-items:center;gap:8px}
.h-card-b{padding:14px 15px}
.h-sec{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.h-sec h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.02em}
.h-sec .line{flex:1;height:1px;background:var(--h-line)}
/* chips */
.h-chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.h-chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.9;flex:none}
.h-chip.good{color:var(--h-good);background:color-mix(in srgb,var(--h-good) 12%,transparent)}
.h-chip.warn{color:var(--h-warn);background:color-mix(in srgb,var(--h-warn) 12%,transparent)}
.h-chip.bad{color:var(--h-bad);background:color-mix(in srgb,var(--h-bad) 12%,transparent)}
.h-chip.neutral{color:var(--h-dim);background:var(--h-raised);border-color:var(--h-line)}
.h-chip.vit{color:var(--h-vit);background:color-mix(in srgb,var(--h-vit) 12%,transparent)}
.h-chip.plain::before{display:none}
.h-mono{font-family:var(--h-mono);font-size:12px;color:var(--h-dim)}
.h-path{font-family:var(--h-mono);font-size:12px;color:var(--h-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr}
.h-muted{color:var(--h-dim)}
/* rows / table */
.h-table{width:100%;border-collapse:separate;border-spacing:0}
.h-table th{text-align:left;font-size:12px;font-weight:600;color:var(--h-dim);font-weight:500;padding:0 12px 8px;border-bottom:1px solid var(--h-line)}
.h-table td{padding:7px 12px;border-bottom:1px solid var(--h-line);font-size:12.5px;vertical-align:middle}
.h-table tbody tr{cursor:pointer}
.h-table tbody tr:hover td{background:var(--h-raised)}
.h-table tbody tr.is-sel td{background:color-mix(in srgb,var(--h-vit) 9%,transparent)}
.h-table tr:last-child td{border-bottom:0}
/* checkbox */
.h-cb{appearance:none;width:15px;height:15px;border:1px solid var(--h-line2);border-radius:4px;background:transparent;display:inline-grid;place-items:center;cursor:pointer;margin:0;flex:none}
.h-cb:checked{background:var(--h-text);border-color:var(--h-text)}
.h-cb:checked::after{content:"";width:8px;height:4px;border-left:1.8px solid var(--h-bg);border-bottom:1.8px solid var(--h-bg);transform:rotate(-45deg) translateY(-1px)}
.h-switch{position:relative;width:30px;height:17px;border-radius:999px;background:var(--h-line2);cursor:pointer;flex:none;transition:background .15s}
.h-switch::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--h-panel);transition:transform .15s}
.h-switch.on{background:var(--h-text)}
.h-switch.on::after{transform:translateX(13px)}
/* toast */
.h-toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:50;align-items:flex-end}
.h-toast{display:flex;align-items:center;gap:9px;max-width:420px;padding:10px 13px;border-radius:8px;font-size:12.5px;border:1px solid var(--h-line2);box-shadow:0 12px 32px rgba(0,0,0,.35);background:var(--h-panel);color:var(--h-text)}
.h-toast.ok{border-left:3px solid var(--h-good)}
.h-toast.warn{border-left:3px solid var(--h-warn)} .h-toast.error{border-left:3px solid var(--h-bad)}
.h-toast .x{margin-left:6px;color:var(--h-faint);font-size:14px}
/* dialog */
.h-overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--h-bg) 62%,transparent);backdrop-filter:blur(3px);z-index:40;display:grid;place-items:center;padding:24px}
.h-dialog{width:min(560px,100%);background:var(--h-panel);border:1px solid var(--h-line2);border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.h-dialog-h{padding:16px 18px 6px}
.h-dialog-h h3{margin:0;font-size:15px}
.h-dialog-h p{margin:6px 0 0;color:var(--h-dim);font-size:12.5px}
.h-dialog-b{padding:14px 18px 18px}
.h-dialog-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--h-line)}
.h-tabs{display:flex;gap:4px;border-bottom:1px solid var(--h-line);padding:0 18px}
.h-tab{height:34px;font-size:12.5px;color:var(--h-dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.h-tab.is-active{color:var(--h-text);border-bottom-color:var(--h-text);font-weight:600}
.h-tab .n{font-family:var(--h-mono);font-size:12px;margin-left:5px;color:var(--h-faint)}
/* drawer */
.h-drawer-mask{position:fixed;inset:0;background:color-mix(in srgb,var(--h-bg) 55%,transparent);backdrop-filter:blur(2px);z-index:38}
.h-drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,92vw);background:var(--h-panel);border-left:1px solid var(--h-line2);z-index:39;display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(0,0,0,.35)}
.h-drawer-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--h-line)}
.h-drawer-b{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.h-drawer-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--h-line)}
.h-close{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--h-dim);margin-left:auto}
.h-close:hover{background:var(--h-raised);color:var(--h-text)}
/* misc */
.h-kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:12.5px}
.h-kv dt{color:var(--h-dim)} .h-kv dd{margin:0}
.h-empty{padding:34px 16px;text-align:center;color:var(--h-dim);font-size:13px}
.h-bar{height:4px;border-radius:4px;background:var(--h-line2);overflow:hidden}
.h-bar i{display:block;height:100%;background:var(--h-text);border-radius:4px}
.h-bar.warn i{background:var(--h-bad)}
.h-link{color:var(--h-vit);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--h-vit) 40%,transparent)}
.h-code{font-family:var(--h-mono);font-size:12px;line-height:1.65;background:var(--h-raised);border:1px solid var(--h-line);border-radius:8px;padding:12px;margin:0;overflow:auto;white-space:pre}
.h-split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1100px){ .h-split{grid-template-columns:1fr} }
.h-field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--h-dim)}
.h-input{height:32px;padding:0 10px;border:1px solid var(--h-line2);border-radius:7px;background:var(--h-raised);color:var(--h-text);font-size:12.5px;outline:none;width:100%}
.h-input:focus{border-color:var(--h-text)}
.h-seg{display:inline-flex;border:1px solid var(--h-line2);border-radius:7px;overflow:hidden}
button{font:inherit;border:0;background:none;padding:0;color:inherit;cursor:pointer;line-height:normal}
input[type=checkbox]{-webkit-appearance:none;appearance:none}
.h-seg button{height:26px;padding:0 9px;font-size:12px;color:var(--h-dim)}
.h-seg button.is-active{background:var(--h-text);color:var(--h-bg);font-weight:600}
.h-in{animation:h-in .28s cubic-bezier(.2,.7,.2,1)}
@keyframes h-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.i{display:inline-flex;align-items:center}.i svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5}
.h-nav .i svg,.h-btn .i svg{width:14px;height:14px}
.h-search input{outline:none;color:var(--h-text)}
.h-tabs-m{display:none}
@media (max-width:880px){
  .h-tabs-m{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--h-line);background:var(--h-panel);padding:6px 4px;gap:2px}
  .h-tabs-m button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--h-dim);padding:4px 0}
  .h-tabs-m button.is-active{color:var(--h-text)}
  .h-view{padding:16px}
  .h-drawer{width:100vw}
}
/* ============ v2 · 扫描仪器 ============ */
/* 顶栏下沿 2px 全局进度轨：整轮真实比率（绝不 per-root），跨页存活 */
.h-track{position:absolute;left:0;right:0;bottom:-2px;height:2px;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
.h-track.on{opacity:1}
.h-track i{position:absolute;top:0;bottom:0;left:0;width:calc(var(--p,0) * 100%);border-radius:0 2px 2px 0;overflow:hidden;
  background:color-mix(in srgb,var(--h-vit) 45%,transparent);transition:width .12s linear}
/* 整轮真实比率 + accent 流光：root 内没有可信子进度，所以只在已完成的整轮比率上扫一道光 */
.h-track i::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--h-vit) 96%,transparent),transparent);
  animation:h-trackflow 1.5s linear infinite}
@keyframes h-trackflow{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.h-track.flash i{background:var(--h-good);animation:h-flash .55s ease-out 1 forwards}
.h-track.flash i::after{animation:none;opacity:0}
@keyframes h-flash{0%{opacity:1}60%{opacity:1}100%{opacity:0}}

/* 扫描按钮：宽度恒定，状态切换只换内部，绝不抖动（min-width 取最宽态：点击取消 · 6/6 + 6 枚刻度计 + 图标） */
.h-scanbtn{min-width:190px;justify-content:flex-start;gap:6px;transition:border-color .15s,color .15s,background .15s}
/* 非扫描态没有右侧刻度计，定宽后若仍左对齐会留一块空白：居中摆放 */
.h-scanbtn:not(.scanning){justify-content:center}
.h-scanbtn .spin{animation:h-spin 2s linear infinite;transform-origin:50% 50%;display:inline-flex;flex:none}
.h-scanbtn .spin svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
@keyframes h-spin{to{transform:rotate(360deg)}}
.h-ticks{display:inline-flex;gap:2px;margin-left:auto;flex:none}
.h-tick{width:6px;height:8px;border-radius:2px;border:1px solid var(--h-line2);background:transparent;flex:none}
.h-tick.done{background:var(--h-vit);border-color:var(--h-vit)}
.h-tick.cur{border-color:var(--h-vit);background:color-mix(in srgb,var(--h-vit) 22%,transparent);position:relative;overflow:hidden}
.h-tick.cur::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--h-vit) 85%,transparent),transparent);
  animation:h-tickflow 1.1s linear infinite}
@keyframes h-tickflow{to{transform:translateX(100%)}}
/* 取消待命：扫描中 hover 按钮 → 文案换「点击取消」，warn */
.h-scanbtn.scanning:hover .lbl-run{display:none}
.h-scanbtn.scanning:hover .lbl-cancel{display:inline}
.h-scanbtn .lbl-cancel{display:none}
/* 描边按钮：warn 描边 + warn 文字（两主题都压在深/浅底上，对比足够） */
.h-btn:not(.primary).h-scanbtn.scanning:hover{border-color:var(--h-warn);color:var(--h-warn);background:color-mix(in srgb,var(--h-warn) 8%,transparent)}
.h-btn:not(.primary).h-scanbtn.scanning:hover .h-tick{border-color:color-mix(in srgb,var(--h-warn) 55%,transparent)}
.h-btn:not(.primary).h-scanbtn.scanning:hover .h-tick.done{background:color-mix(in srgb,var(--h-warn) 70%,transparent);border-color:color-mix(in srgb,var(--h-warn) 70%,transparent)}
.h-btn:not(.primary).h-scanbtn.scanning:hover .h-tick.cur{border-color:var(--h-warn);background:color-mix(in srgb,var(--h-warn) 25%,transparent)}
/* 实心主按钮：整颗换成 warn 底 + 墨色字，刻度计跟着换墨色（warn 文字压反色底会掉到 4.5 以下） */
.h-btn.primary.h-scanbtn.scanning:hover{background:var(--h-warn);border-color:var(--h-warn);color:var(--h-ink);opacity:1}
.h-btn.primary.h-scanbtn.scanning:hover .h-tick{border-color:color-mix(in srgb,var(--h-ink) 40%,transparent)}
.h-btn.primary.h-scanbtn.scanning:hover .h-tick.done{background:var(--h-ink);border-color:var(--h-ink)}
.h-btn.primary.h-scanbtn.scanning:hover .h-tick.cur{border-color:var(--h-ink);background:color-mix(in srgb,var(--h-ink) 28%,transparent)}
/* 结果态：描边按钮用状态色；主按钮保持反色文字，完成信号交给进度轨闪光 / chip / toast */
.h-btn:not(.primary).h-scanbtn.done-ok{border-color:color-mix(in srgb,var(--h-good) 55%,transparent);color:var(--h-good)}
.h-btn:not(.primary).h-scanbtn.canceled{border-color:color-mix(in srgb,var(--h-warn) 55%,transparent);color:var(--h-warn)}
.h-btn.primary.h-scanbtn.done-ok,.h-btn.primary.h-scanbtn.canceled{background:var(--h-text);border-color:var(--h-text);color:var(--h-bg)}

/* 概览扫描状态行（mono 12.5 --faint，唯一允许的新元素） */
.h-statusline{display:flex;align-items:center;gap:7px;padding:0 2px 10px;margin:0 0 14px;
  border-bottom:1px solid var(--h-line);font-family:var(--h-mono);font-size:12.5px;color:var(--h-faint);
  font-variant-numeric:tabular-nums;min-height:20px;white-space:nowrap;overflow:hidden}
.h-statusline .sep{color:color-mix(in srgb,var(--h-faint) 55%,transparent)}
.h-statusline .live{color:var(--h-vit)}
.h-statusline .cancel{margin-left:6px;color:var(--h-warn);border-bottom:1px solid color-mix(in srgb,var(--h-warn) 40%,transparent)}
.h-statusline .num{color:var(--h-text)}
.h-statusline .trunc{color:var(--h-warn)}

/* 决定队列 */

.h-readout{display:flex;flex-direction:column;gap:0}

.h-bignum .lab{font-size:12px;color:var(--h-dim);margin-top:5px}
.h-bignum.live .stat{color:var(--h-vit)}

.stat.pulse{animation:h-pulse .55s cubic-bezier(.2,.7,.2,1)}
@keyframes h-pulse{0%{transform:translateY(0)}30%{color:var(--h-vit);transform:translateY(-2px)}100%{transform:translateY(0)}}
/* root 刻度计：6 段小格 */
.h-gauge-wrap{padding:2px 15px 12px;display:flex;flex-direction:column;gap:8px}
.h-gauge-h{display:flex;align-items:baseline;gap:8px}
.h-gauge-h .cap{font-family:var(--h-mono);font-size:12px;color:var(--h-faint);font-variant-numeric:tabular-nums}
.h-gauge-h .cap b{color:var(--h-text);font-weight:500}
.h-gauge-h .rt{margin-left:auto;font-family:var(--h-mono);font-size:12px;color:var(--h-faint)}
.h-gauge{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.h-gseg{position:relative;height:8px;border-radius:3px;background:var(--h-line2);overflow:hidden}
.h-gseg.done{background:var(--h-good)}
.h-gseg.cur{background:color-mix(in srgb,var(--h-good) 26%,var(--h-line2))}
.h-gseg.cur::after{content:"";position:absolute;top:0;bottom:0;left:0;width:55%;
  background:linear-gradient(90deg,transparent,var(--h-good),transparent);animation:h-gaugeflow .95s linear infinite}
@keyframes h-gaugeflow{0%{transform:translateX(-120%)}100%{transform:translateX(240%)}}
.h-gauge-note{font-family:var(--h-mono);font-size:12px;color:var(--h-faint)}
.h-card-h button.tbtn{font-family:var(--h-mono);font-size:12px;color:var(--h-dim);border:1px solid var(--h-line);border-radius:6px;height:22px;padding:0 8px}
.h-card-h button.tbtn:hover{background:var(--h-raised);color:var(--h-text)}

.h-proj-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:-3px}
.h-proj-row .h-mono{font-size:12px}

/* 落点状态卡片网格（替换原四列表格；行距节奏对齐决定队列的 11px 呼吸） */
.h-tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.h-tcard{display:flex;flex-direction:column;gap:10px;padding:12px 14px;cursor:pointer;

<script type="text/plain" id="v2-tpl">

  <button @click="scanClick">{{ running ? '停止扫描' : '开始扫描' }}</button>
  <button @click="demoAt(5)">at=5</button>
  <button @click="demoAt(8)">at=8</button>
  <button @click="demoAt(12)">at=12</button>
  <button :class="{on:truncated}" @click="truncated=!truncated">T 截断</button>

</script>
<script type="module">
import * as Vue from 'https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.esm-browser.prod.js';
const { createApp, ref, reactive, computed, watch, onMounted } = Vue;
const ICON = Object.fromEntries(Object.entries(ICON_RAW).map(([k,v]) => [k, '<svg viewBox="0 0 24 24">' + v + '</svg>']));
const app = createApp({
  template: document.getElementById('v2-tpl').textContent,
  setup(){
    const params = new URLSearchParams(location.search);
    const speed = ref(Math.min(8, Math.max(1, parseInt(params.get('speed') || '1', 10) || 1)));
    const queueClean = params.has('clean');       // ?clean=1 → 决定队列空态演示
    const paramTheme = ['dark','light'].includes(params.get('theme')) ? params.get('theme') : null;
    const theme = ref(paramTheme || localStorage.getItem('heron.theme') || 'dark');
    const applyTheme = () => { document.documentElement.dataset.theme = theme.value; if(!paramTheme) localStorage.setItem('heron.theme', theme.value); };
    watch(theme, applyTheme, { immediate:true });
    const ALL_VIEWS = ['overview','library','discover','sources','projects','upgrades','doctor','settings'];
    const view = ref(ALL_VIEWS.includes(params.get('view')) ? params.get('view') : 'overview');

    /* ---------- 发现池（按 root 顺序的 51 个样例） ---------- */
    const hashHue = s => { let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))%360; return h; };
    const DISCOVERED = [];
    SCAN_ROOTS.forEach(r=>{ SAMPLE_NAMES[r.client].slice(0,r.count).forEach(n=>{
      DISCOVERED.push({ name:n, client:r.client, path:r.path+'/'+n, hue:hashHue(n), initial:n[0].toUpperCase() });
    }); });

    /* ---------- 扫描状态机：idle → run(prep/traverse/ingest/sum) → done|canceled → idle ---------- */
    const scan = reactive({ phase:'idle', stage:'prep', root:0, found:0 });
    const prog = ref(0);                             // 顶栏进度轨 = 整轮真实比率
    const lastScanLabel = ref('42 秒前');
    const truncated = ref(false);
    const stream = ref(DISCOVERED.slice());
    const running = computed(()=> scan.phase==='run');
    const ROOT_OFF = SCAN_ROOTS.reduce((a,r,i)=>{ a.push(i?a[i-1]+SCAN_ROOTS[i-1].count:0); return a; },[]);
    const TOTAL = PHASE_PREP + SCAN_ROOTS.reduce((s,r)=>s+r.dur,0) + PHASE_INGEST + PHASE_SUM; // =12000
    let TL=null, tIdx=0, tTimer=null, elapsed=0, lastNow=0;
    const rootCursor = [0,0,0,0,0,0];

    function buildTimeline(){
      const ev=[]; let t=PHASE_PREP;
      ev.push({t:0, type:'prep'});
      SCAN_ROOTS.forEach((r,i)=>{
        ev.push({t, type:'root', i});
        const nb = Math.max(1, Math.min(r.count, Math.round(r.dur/320)));   // 每 ~300ms 一小批
        const base = Math.floor(r.count/nb), rem = r.count%nb, span = r.dur-500;
        for(let k=0;k<nb;k++){
          const n = base + (k<rem?1:0);
          if(n>0) ev.push({t:t+250+span*k/(nb-1||1), type:'batch', i, n});
        }
        t += r.dur;
      });
      ev.push({t, type:'ingest'}); t += PHASE_INGEST;
      ev.push({t, type:'sum'});    t += PHASE_SUM;
      ev.push({t, type:'end'});
      return ev;
    }
    TL = buildTimeline();

    function scanStart(at){
      if(scan.phase!=='idle') return;              // 扫描中重复点击=取消，永不排队第二个任务
      scan.phase='run'; scan.stage='prep'; scan.root=0; scan.found=0; prog.value=0;
      rootCursor.fill(0);
      stream.value=[]; tIdx=0;
      elapsed = Number.isFinite(at) ? at*1000 : 0;   // ?at=SECONDS 快进
      lastNow = performance.now();
      tTimer = setInterval(tick,50);
      tick();
    }
    function demoAt(n){                              // 演示条：直接落到第 n 秒
      if(tTimer){ clearInterval(tTimer); tTimer=null; }
      scan.phase='idle'; scanStart(n);
    }
    function tick(){
      const now=performance.now();
      elapsed += (now-lastNow)*speed.value; lastNow=now;
      prog.value = Math.min(1, elapsed/TOTAL);       // 只有整轮比率，root 内不报百分比
      while(tIdx<TL.length && TL[tIdx].t<=elapsed){
        const e=TL[tIdx++];
        if(e.type==='root'){ scan.stage='traverse'; scan.root=e.i; }
        else if(e.type==='batch'){
          const from=ROOT_OFF[e.i]+rootCursor[e.i], items=DISCOVERED.slice(from,from+e.n);
          rootCursor[e.i]+=e.n; scan.found+=e.n;
          items.forEach((d,k)=>{ d.sd = Math.min(k,4)*55 });  // stagger 固定在入批时刻，不随索引漂移
          stream.value = items.concat(stream.value);  // 增量流入：新批次顶到最前
          pulse(bump); pulse(numPulse);
        }
        else if(e.type==='prep') scan.stage='prep';
        else if(e.type==='ingest') scan.stage='ingest';
        else if(e.type==='sum') scan.stage='sum';
        else finishScan();
      }
    }
    function scanCancel(){
      if(scan.phase!=='run') return;
      clearInterval(tTimer); tTimer=null;
      const kept=scan.found;
      scan.phase='canceled'; prog.value=0;
      setTimeout(()=>{ if(scan.phase==='canceled') scan.phase='idle'; },1400);
      say(`扫描已取消 · 已发现 ${kept} 处保留`,'warn');
    }
    function finishScan(){
      clearInterval(tTimer); tTimer=null;
      SCAN_ROOTS.forEach((r,i)=>{ rootCursor[i]=r.count; });
      scan.found=51; scan.stage='sum'; prog.value=1; stream.value=DISCOVERED.slice();
      scan.phase='done'; lastScanLabel.value='刚刚'; pulse(bump); pulse(numPulse);
      setTimeout(()=>{ if(scan.phase==='done'){ scan.phase='idle'; prog.value=0; } },1600);
      if(truncated.value)
        say('结果不完整 · 已达 50 000 目录上限','error',{icon:ICON.alert,actionLabel:'排除设置',link:true,action:()=>go('settings')});
      else
        say('扫描完成 · 51 个新发现 · 2.8s','ok',{actionLabel:'查看',action:()=>go('discover')});
    }
    function scanClick(){ scan.phase==='run' ? scanCancel() : scanStart(); }
    const unmanaged = computed(()=> running.value ? scan.found : (queueClean ? 0 : 51));
    const brokenLinks = ref(queueClean ? 0 : 1);
    const queueCount = computed(()=> (brokenLinks.value>0?1:0)+(unmanaged.value>0?1:0));
    /* 派生显示值 */
    const rootNo = computed(()=> !running.value ? (scan.phase==='done' ? 6 : '—')
                              : (scan.stage==='prep' ? 0 : (scan.stage==='traverse' ? scan.root+1 : 6)));
    const stageText = computed(()=>{
      if(scan.stage==='prep') return '准备 → 枚举扫描根';
      if(scan.stage==='ingest') return '入库 → 写入 Skill 索引';
      if(scan.stage==='sum') return '汇总 → 统计与去重';
      return '遍历中 → '+SCAN_ROOTS[scan.root].path;
    });
    const runSuffix = computed(()=> scan.stage==='traverse' ? ' '+(scan.root+1)+'/6' : ' '+({prep:'准备',ingest:'入库',sum:'汇总'})[scan.stage]);
    const cancelSuffix = computed(()=> scan.stage==='traverse' ? ' · '+(scan.root+1)+'/6' : '');
    const rootShort = computed(()=> !running.value ? (scan.phase==='done' ? '完成' : '待机')
                              : (scan.stage==='traverse' ? SCAN_ROOTS[scan.root].client : ({prep:'枚举中',ingest:'写入',sum:'统计'})[scan.stage]));
    const gaugeNote = computed(()=> running.value && scan.stage==='traverse'
      ? '遍历 '+SCAN_ROOTS[scan.root].path+' · root 内不报百分比'
      : '6 个根 · 完成即点亮 · root 内不报百分比');
    function tickClass(n){
      if(scan.phase==='done') return 'done';
      if(!running.value || scan.stage==='prep') return '';
      if(scan.stage==='traverse') return n<scan.root?'done':(n===scan.root?'cur':'');
      return 'done';
    }
    function pulse(r){
      r.value=false;
      requestAnimationFrame(()=>{ r.value=true; setTimeout(()=>{ r.value=false; },560); });
    }

    /* ---------- 侧栏（真实分组） ---------- */
    const bump = ref(false), numPulse = ref(false);
    const NAV = computed(()=>[
      { group:'工作台', items:[
        { id:'overview', label:'概览', icon:'overview' },
      ]},
      { group:'收集·分发', items:[
        { id:'library',  label:'我的 Skill', icon:'library', count:1 },
        { id:'discover', label:'发现',       icon:'discover', count:unmanaged.value, tone:'warn', bump:bump.value },
        { id:'sources',  label:'来源与市场', icon:'sources' },
      ]},
      { group:'维护', items:[
        { id:'upgrades', label:'更新', icon:'upgrades', count:3 },
        { id:'doctor',   label:'体检', icon:'doctor', count:1, tone:'bad' },
        { id:'projects', label:'项目', icon:'projects' },
        { id:'settings', label:'设置', icon:'settings' },
      ]},
    ]);

    /* ---------- toast ---------- */
    const toast = ref(null); let toastTimer=null;
    function say(text, level, opts){
      toast.value = Object.assign({ text, level:level||'ok', icon:level==='warn'?ICON.alert:(level==='error'?ICON.x:ICON.check) }, opts||{});
      clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.value=null, (opts&&opts.actionLabel)?5000:2600);
    }
    function go(v){ view.value=v; selected.value=[]; if(v==='doctor') toast.value=null; }
    function toggleTheme(){ theme.value = theme.value==='dark'?'light':'dark'; }

    /* ---------- 落点卡片：状态 chip、品牌线描图标弱底、路径复制 ---------- */
    function tState(t){
      if(t.broken>0) return { cls:'bad', txt:'坏链 '+t.broken };
      if(t.live>0)   return { cls:'good', txt:'生效 '+t.live };
      return { cls:'neutral', txt:'未被扫描' };
    }
    // WCAG 相对亮度 / 对比度，用来把品牌描边色在弱底上拉到 ≥4.5:1
    const relLum = hex => { const v=parseInt(hex.slice(1),16), ch=c=>c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);
      return 0.2126*ch((v>>16&255)/255)+0.7152*ch((v>>8&255)/255)+0.0722*ch((v&255)/255); };
    const toRgb = h => { const v=parseInt(h.slice(1),16); return [v>>16&255, v>>8&255, v&255]; };
    const toHex = a => '#' + a.map(c=>Math.round(Math.max(0,Math.min(255,c))).toString(16).padStart(2,'0')).join('');
    const mixc = (a,b,t) => { const x=toRgb(a), y=toRgb(b); return toHex(x.map((c,i)=>c+(y[i]-c)*t)); };
    const crat = (a,b) => { const l1=relLum(a), l2=relLum(b); return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05); };
    const PANEL = { dark:'#0F0E0C', light:'#FFFFFF' };
    function tglyph(kind){
      // 真实应用图标是透明底的黑鹭，深主题需要一块浅托，否则描不出形
      if(kind==='heron') return { background: theme.value==='dark' ? '#E9E3D6' : '#F1EDE5' };
      const brand = CLIENT_COLORS[kind] || '#868e96', dark = theme.value==='dark';
      const bg = mixc(PANEL[dark?'dark':'light'], brand, .12);   // 与 .h-chip 弱底同一词汇
      let ink = brand, k = 0;
      while(crat(bg, ink) < 4.5 && k < .72){ k += .03; ink = mixc(brand, dark ? '#FFFFFF' : '#0B0A09', k); }
      return { background:bg, color:ink };
    }
    const copied = ref(-1); let copiedTimer=null;
    function copyPath(text, i){
      const ok = () => { copied.value=i; clearTimeout(copiedTimer); copiedTimer=setTimeout(()=>copied.value=-1,1500); };
      const legacy = () => { const ta=document.createElement('textarea'); ta.value=text;
        ta.style.cssText='position:fixed;top:-20px;opacity:0'; document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); ok(); }catch(e){} ta.remove(); };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, legacy);
      else legacy();
    }

    /* ---------- 其余视图状态（照搬 dir-1） ---------- */
    const query=ref(''), filter=ref('all'), libView=ref('table'), drawer=ref(null), selected=ref([]);
    const diffFile=ref(0), adoptKeep=ref(false), dialog=ref(null), activeMarket=ref('skills_sh'), marketQuery=ref('');
    const sel = computed(()=> SKILLS.find(s=>s.slug===drawer.value));
    const visibleSkills = computed(()=> SKILLS.filter(s=>{
      const q=query.value.trim().toLowerCase();
      if(q && !(s.slug+s.name+s.desc).toLowerCase().includes(q)) return false;
      if(filter.value==='issues') return ['broken','shadowed'].includes(Object.values(s.vis)[2])||s.vis.cursor==='broken';
      return true;
    }));
    function toggleSel(k){ const i=selected.value.indexOf(k); i<0?selected.value.push(k):selected.value.splice(i,1); }
    function setVis(t,v){ const s=sel.value; if(s) s.vis[t]=v; }
    function projectSelected(){ dialog.value=null; say(`已投影 ${selected.value.length} 个 Skill 到 2 个落点`); selected.value=[]; }
    const VIS_TONE = { visible:'good', shadowed:'warn', broken:'bad', not_scanned:'neutral' };
    const VIS_LABEL = { visible:'生效', shadowed:'被压制', broken:'坏链', not_scanned:'未扫描' };
    const UP_TONE = { up_to_date:'good', has_update:'vit', diverged:'bad', local_modified:'warn', not_tracked:'neutral' };
    const UP_LABEL = { up_to_date:'已最新', has_update:'有更新', diverged:'分叉', local_modified:'本地已改', not_tracked:'未跟踪' };
    const MARKET_ITEMS = [
      { key:'anthropics/skills · wechat-mp', ver:'1.5.0', summary:'公众号排版、发文与配图生成；官方维护' },
      { key:'skills.sh/wechat-mp', ver:'1.4.2', summary:'社区镜像，含配图扩展' },
      { key:'anthropics/skills · docx', ver:'1.0.0', summary:'Word 文档读写，保留批注' },
      { key:'acme/slides', ver:'0.5.0', summary:'大纲 → 演示稿，含图表' },
    ];

    /* ---------- 键盘与演示参数 ---------- */
    onMounted(()=>{
      addEventListener('keydown', e=>{
        if(e.target && ['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
        if(e.key==='t'||e.key==='T'){ truncated.value=!truncated.value; say(`truncated 演示：${truncated.value?'开（完成 toast 换成结果不完整）':'关'}`, truncated.value?'warn':'ok'); }
        if(e.key==='Escape' && scan.phase==='run'){ e.preventDefault(); scanCancel(); }   // Esc = 取消扫描
      });
      const at = parseFloat(params.get('at'));
      if(params.get('scan')==='auto') setTimeout(()=>scanStart(Number.isFinite(at)?at:null), 350);
    });

    return { view, theme, ICON, VIEWS, NAV, SCAN_ROOTS, CLIENT_COLORS, TARGET_ROWS,
      scan, running, prog, unmanaged, brokenLinks, queueCount, lastScanLabel, truncated, bump, numPulse,
      stageText, rootNo, rootShort, gaugeNote, runSuffix, cancelSuffix, tickClass,
      scanClick, scanCancel, scanStart, demoAt, speed,
      tState, tglyph, CLIENT_ICON, HERON_ICON, copied, copyPath,
      SKILLS, TARGETS, UPGRADES, ISSUES, PROJECTS, MARKETS,
      stream, discoveredNow:computed(()=>stream.value),
      toast, say, go, toggleTheme, dialog, drawer, selected, query, filter, libView, diffFile, adoptKeep, activeMarket, marketQuery,
      sel, visibleSkills, toggleSel, setVis, projectSelected,
      VIS_TONE, VIS_LABEL, UP_TONE, UP_LABEL, MARKET_ITEMS };
  }
});
app.mount('body');
</script>
</body></html>
