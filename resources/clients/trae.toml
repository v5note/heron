# Trae — scan locations + presence rules.
# global_skills is doc-verified (docs.trae.ai/ide/skills, 2026-11-23).
# NOTE: Trae CN is a separate build with its own ~/.trae-cn directory and ships as its own entry
# (trae-cn.toml), so `trae` reports "not detected" on a machine that only has the CN build.
id = "trae"
display_name = "Trae"
priority = 60
global_skills = ".trae/skills"
project_skills = ".trae/skills"
link_modes = ["symlink", "junction", "copy"]
verified_at = "2026-11-23"
verified_by = "doc"

# No [native_scan] section: injection was never researched for this client, and the settings page
# only lists clients we actually have a statement about.
[detect]
dirs = ["~/.trae"]
apps = ["Trae.app"]

[[detect.commands]]
bin = "trae"
args = ["--version"]
