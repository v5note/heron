name: ci

on:
  push:
    branches: [main]
    # Tags trigger the same workflow so `release`/`publish` can run for a version.
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-2022]
        include:
          - os: macos-latest
            # A cancelled macOS runner is an infrastructure hiccup, not a code failure.
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # System dependencies Tauri needs on Linux.
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Windows runs *without* elevation: this is the risk-R3 gate (junction removal must never
      # delete the target). Linux/macOS run the portable subset.
      - name: Tests
        run: cargo test --workspace --all-targets

  windows-link-gate:
    name: windows link safety (non-elevated)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Junction / symlink safety (L1-L6)
        run: cargo test -p heron-platform --test link_safety_windows -- --nocapture
      - name: Scanner and VCS on Windows
        run: |
          cargo test -p heron-scan
          cargo test -p heron-vcs

  ui:
    name: ui
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui typecheck
      - run: pnpm --dir ui i18n:check
      - run: pnpm --dir ui ipc:check
      - run: pnpm --dir ui build

  # Release job. Signs the *updater* payloads with a Tauri minisign key pair, so releases can be
  # distributed and self-updated without an Apple Developer ID or a Windows code-signing
  # certificate. The trade-off is recorded in docs/SIGNING.md: binaries are not OS-notarized, so
  # first-run Gatekeeper/SmartScreen prompts require a manual "open anyway".
  release:
    name: release (${{ matrix.platform }})
    continue-on-error: ${{ matrix.experimental == true }}
    # Deliberately not `needs: rust`: the macOS runner is occasionally unavailable
    # (cancelled after 1s, zero steps) and that must not block a release. The gate is the
    # link-safety matrix plus the UI build, which always run.
    needs: [windows-link-gate, ui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-aarch64
            target: aarch64-apple-darwin
            experimental: true
          - os: macos-latest
            platform: darwin-x86_64
            target: x86_64-apple-darwin
            experimental: true
          - os: windows-2022
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            experimental: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm --dir ui install --frozen-lockfile

      - name: Read version from tauri.conf.json
        id: meta
        shell: bash
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Refuse to build an unsigned release: an unsigned updater payload cannot be verified by
      # installed clients, so publishing one would brick the update path for everyone.
      - name: Require the signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; see docs/SIGNING.md"
            exit 1
          fi

      - name: Build signed bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm --dir ui build
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --target "${{ matrix.target }}"

      # Collect what the updater consumes (.app.tar.gz / .nsis.zip plus their .sig) and the
      # installers humans download (.dmg / .exe). Filenames are preserved: Tauri already encodes
      # the architecture, and latest.json keys off the suffix.
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          B="target/${{ matrix.target }}/release/bundle"
          # Tauri names the macOS updater payload "Heron.app.tar.gz" with no architecture in it.
          # Rename it so latest.json (and anyone reading the release) can tell builds apart.
          if [ "${{ runner.os }}" = "macOS" ] && [ -f "$B/macos/Heron.app.tar.gz" ]; then
            ARCH="${{ matrix.platform == 'darwin-x86_64' && 'x64' || 'aarch64' }}"
            VERSION="${{ steps.meta.outputs.version }}"
            mv "$B/macos/Heron.app.tar.gz" "$B/macos/Heron_${VERSION}_${ARCH}.app.tar.gz"
            mv "$B/macos/Heron.app.tar.gz.sig" "$B/macos/Heron_${VERSION}_${ARCH}.app.tar.gz.sig"
          fi
          find "$B" -maxdepth 3 -type f \( \
              -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
              -o -name '*.nsis.zip' -o -name '*.nsis.zip.sig' \
              -o -name '*.dmg' -o -name '*.exe' \) -exec cp {} dist/ \;
          ls -la dist

      - name: Fail when signatures are missing
        shell: bash
        run: |
          shopt -s nullglob
          payloads=(dist/*.app.tar.gz dist/*.nsis.zip dist/*.appimage.tar.gz)
          if [ ${#payloads[@]} -eq 0 ]; then
            echo "::error::no updater payload was produced"
            exit 1
          fi
          for p in "${payloads[@]}"; do
            test -f "$p.sig" || { echo "::error::missing signature for $p"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: heron-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: release
    # `always()` lets this run even when one matrix leg was cancelled; the job itself then fails
    # loudly if no artifacts arrived, so a broken release is never silent.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.release.result != 'skipped'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Read version
        id: meta
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build latest.json
        run: |
          NOTES=""
          if [ -f "releases/${{ steps.meta.outputs.version }}.md" ]; then
            NOTES=$(cat "releases/${{ steps.meta.outputs.version }}.md")
          fi
          python3 scripts/make-latest-json.py \
            --version "${{ steps.meta.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --dir dist --out dist/latest.json --notes "$NOTES" \
            --darwin-arch "${{ vars.HERON_DARWIN_ARCH || 'darwin-aarch64' }}"
          cat dist/latest.json
      - name: Require at least one platform
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("dist/latest.json"))
          platforms = m.get("platforms", {})
          if not platforms:
              raise SystemExit("latest.json has no platforms; refusing to publish")
          print("platforms:", ", ".join(sorted(platforms)))
          PY

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Heron ${{ steps.meta.outputs.version }}
          body_path: releases/${{ steps.meta.outputs.version }}.md
          files: dist/*
          draft: false
          prerelease: false
