<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heron · 方向二 · 编辑部</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('heron.theme') || 'dark');</script>
<style>
:root{
  --h-bg:#090807;--h-panel:#0F0E0C;--h-raised:#151310;--h-line:rgba(246,240,230,.08);
  --h-line2:rgba(246,240,230,.16);--h-text:#EFE8DA;--h-dim:#8A8275;--h-faint:#5A544B;
  --h-ink:#181410;--h-good:#B2C77A;--h-warn:#E3C08A;--h-bad:#E47B66;--h-vit:#9EA8FF;
  --h-sans:"Manrope",-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
  --h-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --h-serif:"EB Garamond","Songti SC",Georgia,serif;
  color-scheme:dark;
}
[data-theme="light"]{
  --h-bg:#FAF9F6;--h-panel:#FFFFFF;--h-raised:#F5F2EC;--h-line:#E8E3DA;--h-line2:#D6CFC3;
  --h-text:#211D18;--h-dim:#6F685D;--h-faint:#A29A8C;
  --h-ink:#FFFFFF;--h-good:#5C7A2E;--h-warn:#8A6216;--h-bad:#A8452F;--h-vit:#4B4BC2;
  color-scheme:light;
}
.h-body{background:var(--h-bg);color:var(--h-text);font-family:var(--h-sans);overflow:hidden}
.h-shell{display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:1fr;height:100vh;overflow:hidden}
@media (max-width:880px){ .h-shell{grid-template-columns:1fr} }
[data-rail]{display:none}
@media (max-width:880px){ [data-rail]{display:none !important} }
/* rail */
.h-rail{display:flex;flex-direction:column;min-height:0;background:var(--h-panel);border-right:1px solid var(--h-line);padding:0 10px 10px}
.h-rail-head{display:flex;align-items:center;gap:9px;padding:15px 6px 12px}
.h-seal{width:25px;height:25px;border-radius:5px;background:var(--h-text);color:var(--h-bg);display:grid;place-items:center;flex:none}
.h-seal svg{width:15px;height:15px}
.h-wordmark{display:flex;flex-direction:column;line-height:1.12}
.h-wordmark b{font-family:var(--h-serif);font-size:16px;font-weight:600;letter-spacing:.01em}
.h-wordmark small{font-size:10px;color:var(--h-dim);letter-spacing:.08em}
.h-search{display:flex;align-items:center;gap:8px;height:32px;padding:0 9px;margin:2px 0 10px;border:1px solid var(--h-line);border-radius:7px;color:var(--h-dim);font-size:12px;background:var(--h-raised)}
.h-search kbd{margin-left:auto;font-family:var(--h-mono);font-size:10px;color:var(--h-faint);border:1px solid var(--h-line);border-radius:4px;padding:1px 4px}
.h-rail-scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:1px;scrollbar-width:thin}
.h-group{font-family:var(--h-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--h-faint);padding:14px 8px 5px}
.h-nav{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:6px;font-size:12.5px;color:var(--h-dim);position:relative;text-align:left;width:100%}
.h-nav svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5}
.h-nav:hover{background:var(--h-raised);color:var(--h-text)}
.h-nav.is-active{background:var(--h-raised);color:var(--h-text);font-weight:600}
.h-nav.is-active::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--h-vit)}
.h-count{margin-left:auto;font-family:var(--h-mono);font-size:10.5px;color:var(--h-dim);min-width:16px;text-align:right}
.h-count.tone-warn{color:var(--h-warn)} .h-count.tone-bad{color:var(--h-bad)}
.h-rail-foot{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--h-line)}
.h-health{display:flex;gap:7px;flex-wrap:wrap;padding:0 4px}
.h-dot{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--h-dim)}
.h-dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--h-faint)}
.h-dot.good::before{background:var(--h-good)} .h-dot.warn::before{background:var(--h-warn)} .h-dot.bad::before{background:var(--h-bad)}
.h-theme{margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border:1px solid var(--h-line);border-radius:999px;font-size:11px;color:var(--h-dim)}
.h-theme svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6}
.h-main{display:flex;flex-direction:column;min-width:0;min-height:0}
/* topbar */
.h-topbar{display:flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-bottom:1px solid var(--h-line);flex:none;background:var(--h-bg);z-index:5}
.h-crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--h-faint);white-space:nowrap;overflow:hidden}
.h-crumbs b{color:var(--h-text);font-weight:600}
.h-topbar .sp{flex:1}
.h-btn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:7px;font-size:12.5px;font-weight:500;border:1px solid var(--h-line2);color:var(--h-text);white-space:nowrap}
.h-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.h-btn:hover{background:var(--h-raised)}
.h-btn.primary{background:var(--h-text);border-color:var(--h-text);color:var(--h-bg)}
.h-btn.primary:hover{opacity:.9}
.h-btn:disabled{opacity:.45;cursor:default}
.h-view{padding:24px 28px 40px;overflow:auto;flex:1;min-height:0;position:relative}
.h-view-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.h-h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.h-h1 .idx{font-family:var(--h-mono);font-size:11px;color:var(--h-faint);margin-right:8px;font-weight:500;vertical-align:2px}
.h-lead{margin:6px 0 0;color:var(--h-dim);font-size:13px}
.h-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* surfaces */
.h-card{background:var(--h-panel);border:1px solid var(--h-line);border-radius:10px}
.h-card-h{display:flex;align-items:center;gap:8px;padding:12px 15px;border-bottom:1px solid var(--h-line)}
.h-card-h h3{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.02em}
.h-card-h .r{margin-left:auto;display:flex;align-items:center;gap:8px}
.h-card-b{padding:14px 15px}
.h-sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.h-sec h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.02em}
.h-sec .line{flex:1;height:1px;background:var(--h-line)}
/* chips */
.h-chip{display:inline-flex;align-items:center;gap:6px;height:21px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.h-chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.9;flex:none}
.h-chip.good{color:var(--h-good);background:color-mix(in srgb,var(--h-good) 12%,transparent)}
.h-chip.warn{color:var(--h-warn);background:color-mix(in srgb,var(--h-warn) 12%,transparent)}
.h-chip.bad{color:var(--h-bad);background:color-mix(in srgb,var(--h-bad) 12%,transparent)}
.h-chip.neutral{color:var(--h-dim);background:var(--h-raised);border-color:var(--h-line)}
.h-chip.vit{color:var(--h-vit);background:color-mix(in srgb,var(--h-vit) 12%,transparent)}
.h-chip.plain::before{display:none}
.h-mono{font-family:var(--h-mono);font-size:11.5px;color:var(--h-dim)}
.h-path{font-family:var(--h-mono);font-size:11px;color:var(--h-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr}
.h-muted{color:var(--h-dim)}
/* rows / table */
.h-table{width:100%;border-collapse:separate;border-spacing:0}
.h-table th{text-align:left;font-family:var(--h-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--h-faint);font-weight:500;padding:0 12px 8px;border-bottom:1px solid var(--h-line)}
.h-table td{padding:9px 12px;border-bottom:1px solid var(--h-line);font-size:12.5px;vertical-align:middle}
.h-table tbody tr{cursor:pointer}
.h-table tbody tr:hover td{background:var(--h-raised)}
.h-table tbody tr.is-sel td{background:color-mix(in srgb,var(--h-vit) 9%,transparent)}
.h-table tr:last-child td{border-bottom:0}
/* checkbox */
.h-cb{appearance:none;width:15px;height:15px;border:1px solid var(--h-line2);border-radius:4px;background:transparent;display:inline-grid;place-items:center;cursor:pointer;margin:0;flex:none}
.h-cb:checked{background:var(--h-text);border-color:var(--h-text)}
.h-cb:checked::after{content:"";width:8px;height:4px;border-left:1.8px solid var(--h-bg);border-bottom:1.8px solid var(--h-bg);transform:rotate(-45deg) translateY(-1px)}
.h-switch{position:relative;width:30px;height:17px;border-radius:999px;background:var(--h-line2);cursor:pointer;flex:none;transition:background .15s}
.h-switch::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--h-panel);transition:transform .15s}
.h-switch.on{background:var(--h-text)}
.h-switch.on::after{transform:translateX(13px)}
/* toast */
.h-toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:50;align-items:flex-end}
.h-toast{display:flex;align-items:center;gap:9px;max-width:420px;padding:10px 13px;border-radius:8px;font-size:12.5px;border:1px solid var(--h-line2);box-shadow:0 12px 32px rgba(0,0,0,.35)}
.h-toast.ok{background:var(--h-panel);color:var(--h-text);border-left:3px solid var(--h-good)}
.h-toast.warn{border-left:3px solid var(--h-warn)} .h-toast.error{border-left:3px solid var(--h-bad)}
.h-toast .x{margin-left:6px;color:var(--h-faint);font-size:14px}
/* dialog */
.h-overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--h-bg) 62%,transparent);backdrop-filter:blur(3px);z-index:40;display:grid;place-items:center;padding:24px}
.h-dialog{width:min(560px,100%);background:var(--h-panel);border:1px solid var(--h-line2);border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.h-dialog-h{padding:16px 18px 6px}
.h-dialog-h h3{margin:0;font-size:15px}
.h-dialog-h p{margin:6px 0 0;color:var(--h-dim);font-size:12.5px}
.h-dialog-b{padding:14px 18px 18px}
.h-dialog-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--h-line)}
.h-tabs{display:flex;gap:4px;border-bottom:1px solid var(--h-line);padding:0 18px}
.h-tab{height:34px;font-size:12.5px;color:var(--h-dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.h-tab.is-active{color:var(--h-text);border-bottom-color:var(--h-text);font-weight:600}
.h-tab .n{font-family:var(--h-mono);font-size:10.5px;margin-left:5px;color:var(--h-faint)}
/* drawer */
.h-drawer-mask{position:fixed;inset:0;background:color-mix(in srgb,var(--h-bg) 55%,transparent);backdrop-filter:blur(2px);z-index:38}
.h-drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,92vw);background:var(--h-panel);border-left:1px solid var(--h-line2);z-index:39;display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(0,0,0,.35)}
.h-drawer-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--h-line)}
.h-drawer-b{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.h-drawer-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--h-line)}
.h-close{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--h-dim);margin-left:auto}
.h-close:hover{background:var(--h-raised);color:var(--h-text)}
/* misc */
.h-kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:12.5px}
.h-kv dt{color:var(--h-dim)} .h-kv dd{margin:0}
.h-empty{padding:34px 16px;text-align:center;color:var(--h-dim);font-size:13px}
.h-bar{height:4px;border-radius:4px;background:var(--h-line2);overflow:hidden}
.h-bar i{display:block;height:100%;background:var(--h-text);border-radius:4px}
.h-link{color:var(--h-vit);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--h-vit) 40%,transparent)}
.h-code{font-family:var(--h-mono);font-size:11.5px;line-height:1.65;background:var(--h-raised);border:1px solid var(--h-line);border-radius:8px;padding:12px;margin:0;overflow:auto;white-space:pre}
.h-split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1100px){ .h-split{grid-template-columns:1fr} }
.h-field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--h-dim)}
.h-input{height:32px;padding:0 10px;border:1px solid var(--h-line2);border-radius:7px;background:var(--h-raised);color:var(--h-text);font-size:12.5px;outline:none;width:100%}
.h-input:focus{border-color:var(--h-text)}
.h-seg{display:inline-flex;border:1px solid var(--h-line2);border-radius:7px;overflow:hidden}
button{font:inherit;border:0;background:none;padding:0;color:inherit;cursor:pointer;line-height:normal}
input[type=checkbox]{-webkit-appearance:none;appearance:none}
.h-seg button{height:26px;padding:0 9px;font-size:11.5px;color:var(--h-dim)}
.h-seg button.is-active{background:var(--h-text);color:var(--h-bg);font-weight:600}
</style>
<style>
.bp{--bg:#FFFFFF;--fg:#000000;--mute:#5E5E5E;--faint:#626262;--hair:#D6D6D6;--link:#0000EE;--hot:#D92B1F;
 font-family:Inter,-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;color:var(--fg);background:var(--bg);font-size:14px;letter-spacing:-.005em}
.bp[data-theme="dark"]{--bg:#0A0A0A;--fg:#F4F4F4;--mute:#B2B2B2;--faint:#B0B0B0;--hair:#2C2C2C;--link:#9CB8FF;--hot:#FF6A52;color-scheme:dark}
.bp *{box-sizing:border-box}
.bp :where(button){font:inherit;border:0;background:none;padding:0;color:inherit;cursor:pointer;line-height:normal;text-align:left}
.bp .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
.bp .wrap{min-height:100vh;display:flex;flex-direction:column}
.bp .mast{display:flex;align-items:stretch;border-bottom:3px solid var(--fg);height:44px;flex:none}
.bp .mast .name{padding:0 14px;font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;border-right:1px solid var(--fg);white-space:nowrap}
.bp .mast .name svg{width:18px;height:18px}
.bp .mast nav{display:flex;flex:1;min-width:0;overflow:hidden}
.bp .mast nav button{padding:0 11px;font-size:14px;border-right:1px solid var(--hair);white-space:nowrap;color:var(--fg);display:flex;align-items:center;gap:7px}
.bp .mast nav button:hover{background:var(--fg);color:var(--bg)}
.bp .mast nav button.on{background:var(--fg);color:var(--bg);font-weight:700}
.bp .mast nav button .n{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.bp .mast .tools{display:flex;align-items:center;gap:6px;padding:0 12px;border-left:1px solid var(--fg)}
.bp .mast .tools .btn{height:26px}
.bp .band{display:flex;align-items:stretch;border-bottom:1px solid var(--fg)}
.bp .head{flex:1;min-width:0;padding:16px 18px 14px;border-right:1px solid var(--fg)}
.bp .head .kh{font-size:12px;color:var(--mute);display:flex;gap:10px;align-items:center;margin-bottom:6px}
.bp .head .kh .hot{color:var(--hot);font-weight:600}
.bp .head h1{margin:0;font-size:clamp(32px,4vw,52px);line-height:.94;letter-spacing:-.045em;font-weight:800}
.bp .head .dek{margin:10px 0 0;font-size:14px;line-height:1.55;color:var(--mute);max-width:62ch}
.bp .scoreboard{width:330px;flex:none;display:grid;grid-template-columns:1fr;align-content:stretch}
.bp .sb{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid var(--hair);font-size:14px}
.bp .sb:last-child{border-bottom:0}
.bp .sb b{font-size:22px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bp .sb.hot b{color:var(--hot)}
.bp .sb small{font-size:12px;color:var(--faint)}
.bp .main{flex:1;min-height:0;overflow:auto;padding:0 18px 24px}
.bp .mod{border-bottom:1px solid var(--fg);padding:14px 0 16px}
.bp .mod:last-child{border-bottom:0}
.bp .modh{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.bp .modh h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em;text-transform:none}
.bp .modh .k{font-size:12px;color:var(--faint)}
.bp .modh .sp{flex:1}
.bp .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));border-top:1px solid var(--hair)}
.bp .col{border-bottom:1px solid var(--hair);padding:10px 12px;min-height:0}
.bp .col+.col{border-left:1px solid var(--hair)}
.bp .c3{grid-column:span 3}.bp .c4{grid-column:span 4}.bp .c5{grid-column:span 5}.bp .c6{grid-column:span 6}.bp .c7{grid-column:span 7}.bp .c8{grid-column:span 8}.bp .c12{grid-column:span 12}
.bp .col h3{margin:0 0 6px;font-size:13px;font-weight:800;line-height:1.3;letter-spacing:-.01em}
.bp .col p{margin:0;font-size:14px;line-height:1.55;color:var(--mute)}
.bp .col.inv{background:var(--fg);color:var(--bg)}
.bp .col.inv p,.bp .col.inv .k{color:var(--bg);opacity:.82}
.bp .figure{font-size:44px;line-height:.95;font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.bp .figure.hot{color:var(--hot)}
.bp .figure .u{font-size:14px;font-weight:600;letter-spacing:0;margin-left:4px}
.bp .lnk{color:var(--link);text-decoration:underline;text-underline-offset:2px;font-weight:500}
.bp .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.bp .chip{font-size:12px;border:1px solid var(--fg);padding:1px 7px;font-weight:600;white-space:nowrap}
.bp .chip.hot{border-color:var(--hot);color:var(--hot)}
.bp .chip.dim{border-color:var(--hair);color:var(--faint);font-weight:400}
.bp .chip.inv{background:var(--fg);color:var(--bg)}
.bp table.bt{width:100%;border-collapse:collapse}
.bp table.bt th{font-size:12px;font-weight:400;color:var(--faint);text-align:left;padding:0 8px 6px;border-bottom:1px solid var(--fg)}
.bp table.bt td{padding:7px 8px;border-bottom:1px solid var(--hair);font-size:14px;vertical-align:middle}
.bp table.bt tbody tr:hover td{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.bp table.bt tr.sel td{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.bp table.bt td.slug{font-weight:700;letter-spacing:-.01em}
.bp .sq{display:inline-flex;gap:3px;align-items:center}
.bp .sq i{width:11px;height:11px;border:1px solid var(--faint);display:block}
.bp .sq i.on{background:var(--fg);border-color:var(--fg)}
.bp .sq i.bad{background:var(--hot);border-color:var(--hot)}
.bp .sq i.warn{border:2px solid var(--hot);border-color:var(--hot)}
.bp .ck{-webkit-appearance:none;appearance:none;width:14px;height:14px;border:1.5px solid var(--fg);display:inline-grid;place-items:center;margin:0;cursor:pointer;background:transparent;flex:none}
.bp .ck:checked{background:var(--fg)}
.bp .ck:checked::after{content:"";width:7px;height:4px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(-45deg) translateY(-1px)}
.bp .ck:disabled{opacity:.35}
.bp .btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--fg);font-size:14px;white-space:nowrap;background:var(--bg)}
.bp .btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.bp .btn:hover{background:var(--fg);color:var(--bg)}
.bp .btn.solid{background:var(--fg);color:var(--bg)}
.bp .btn.solid:hover{background:var(--hot);border-color:var(--hot);color:#fff}
.bp .btn.hot{border-color:var(--hot);color:var(--hot)}
.bp .btn.hot:hover{background:var(--hot);color:#fff}
.bp .btn:disabled{opacity:.35;cursor:default}
.bp .btn.plain{border-color:transparent;color:var(--mute);padding:0 4px}
.bp .fld{height:30px;border:1px solid var(--fg);padding:0 9px;background:var(--bg);color:var(--fg);font-size:14px;outline:none;min-width:0}
.bp .seg{display:inline-flex;border:1px solid var(--fg)}
.bp .seg button{height:28px;padding:0 10px;font-size:13px;border-right:1px solid var(--fg)}
.bp .seg button:last-child{border-right:0}
.bp .seg button.on{background:var(--fg);color:var(--bg);font-weight:700}
.bp .sw{width:30px;height:16px;border:1.5px solid var(--fg);position:relative;cursor:pointer;flex:none}
.bp .sw::after{content:"";position:absolute;top:2px;left:2px;width:9px;height:9px;background:var(--fg);transition:transform .12s}
.bp .sw.on{background:var(--fg)} .bp .sw.on::after{transform:translateX(13px);background:var(--bg)}
.bp .kv{display:flex;gap:10px;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--hair);font-size:14px}
.bp .kv:last-child{border-bottom:0}
.bp .kv .k{color:var(--faint)}
.bp .pre{margin:0;border:1px solid var(--fg);padding:9px 11px;font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1.65;white-space:pre-wrap;background:color-mix(in srgb,var(--fg) 4%,var(--bg))}
.bp .toast{position:fixed;right:18px;bottom:18px;background:var(--fg);color:var(--bg);padding:9px 13px;font-size:14px;display:flex;gap:10px;align-items:center;z-index:60;border-left:4px solid var(--hot)}
.bp .toast svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.bp .mask{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);z-index:30;display:grid;place-items:center;padding:24px}
.bp .dlg{background:var(--bg);border:3px solid var(--fg);width:min(940px,100%);max-height:90vh;display:flex;flex-direction:column}
.bp .dlg h3{margin:0;padding:11px 14px;border-bottom:1px solid var(--fg);font-size:18px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.bp .dlg .db{padding:12px 14px;overflow:auto}
.bp .dlg .df{padding:10px 14px;border-top:1px solid var(--fg);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.bp .split{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--fg)}
.bp .split>div{padding:10px 12px;min-width:0}
.bp .split>div+div{border-left:1px solid var(--fg)}
.bp .ttabs{display:flex;border:1px solid var(--fg);border-bottom:0}
.bp .ttabs button{padding:5px 10px;font-size:13px;border-right:1px solid var(--fg)}
.bp .ttabs button.on{background:var(--fg);color:var(--bg);font-weight:700}
.bp .mob{display:none}
@media (max-width:1000px){
 .bp .mast nav{display:none}
 .bp .mast{height:auto;flex-wrap:wrap}
 .bp .mast .name{border-right:0;flex:1}
 .bp .band{flex-direction:column}
 .bp .head{border-right:0;border-bottom:1px solid var(--fg);padding:14px}
 .bp .scoreboard{width:auto;grid-template-columns:1fr 1fr}
 .bp .sb:nth-child(odd){border-right:1px solid var(--hair)}
 .bp .main{padding:0 14px 70px}
 .bp .c3,.bp .c4,.bp .c5,.bp .c6,.bp .c7,.bp .c8{grid-column:span 12}
 .bp .col+.col{border-left:0}
 .bp .split{grid-template-columns:1fr}.bp .split>div+div{border-left:0;border-top:1px solid var(--fg)}
 .bp .mob{display:flex;position:fixed;left:0;right:0;bottom:0;border-top:3px solid var(--fg);background:var(--bg);z-index:20;overflow:auto}
 .bp .mob button{padding:8px 12px;font-size:12px;white-space:nowrap;color:var(--mute)}
 .bp .mob button.on{background:var(--fg);color:var(--bg);font-weight:700}
}
</style>

<script type="text/plain" id="bp-tpl">
<div class="bp" :data-theme="theme">
<div class="wrap">

        <div class="grid">
          <div class="col c4"><div class="figure">42<span class="u">份</span></div><h3>收拢</h3><p>散落各处的 Skill 收成一份实体，原位置留链接；重复内容按 hash 自动合并。</p><div class="chips"><span class="chip dim">去重 6</span><span class="chip dim">备份 1</span></div></div>

          <div class="col c4"><div class="figure hot">3<span class="u">个</span></div><h3>升级</h3><p>三方合并，两边改的都保留；合不上的逐文件由你拍板。</p><div class="chips"><span class="chip hot">待合并 1</span><span class="chip dim">本地已改 1</span></div></div>
        </div>
      </section>

      <section class="mod">
        <div class="modh"><h2>今天要你决定的四件事</h2><span class="k">按影响排序</span></div>
        <div class="grid">
          <div class="col c6"><h3><span style="color:var(--hot)">■</span> slides 在 Cursor 里是坏链</h3><p>Cursor 不会加载它，但你会以为加载了。重新投影，或者从 Cursor 撤掉。</p><div class="chips" style="margin-top:10px"><button class="btn hot" @click="go('doctor')">去体检</button><button class="btn plain" @click="say('已打开 slides 详情')">看路径</button></div></div>
          <div class="col c6 inv"><h3>pdf 的「用法」一节两边都改过</h3><p>你加了 OCR 开关，上游 1.5.0 换了调用顺序并新增 fill 子命令。逐文件合并，不是二选一。</p><div class="chips" style="margin-top:10px"><button class="btn" style="border-color:var(--bg);color:var(--bg);background:transparent" @click="go('upgrades')">去合并</button></div></div>
          <div class="col c6"><h3>4 处 Skill 还没纳入管理</h3><p>~/.claude/skills/pdf、~/.codex/skills/notion-sync 等，收拢前会先预览每一步。</p><div class="chips" style="margin-top:10px"><button class="btn" @click="go('discover')">去发现</button></div></div>

          <thead><tr><th>客户端</th><th>落点</th><th>已投影</th><th>生效</th><th>被压制</th><th>未扫描</th><th>坏链</th></tr></thead>

        </table>
        <section style="margin-top:12px">
          <div class="modh"><h2>操作日志</h2><span class="k">可从备份回滚</span></div>

    <!-- LIBRARY -->

      <section class="mod">

        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px">

</div></div>
</div>

<script>
const BP_SETUP = function(){
  const theme = ref(localStorage.getItem('heron.theme') || 'light');
  const view = ref(((location.hash||'#overview').slice(1).split('?')[0]) || 'overview');
  const query = ref(''); const filter = ref('all'); const selected = ref([]); const drawer = ref(null); const toast = ref(null);
  const activeMarket = ref('skills_sh'); const marketQuery = ref('pdf'); const dialog = ref(null); const adoptKeep = ref(true);
  const NAV = [
    {id:'overview',label:'概览',icon:'overview',count:'42'},{id:'library',label:'我的 Skill',icon:'library',count:'42'},
    {id:'discover',label:'发现',icon:'discover',count:'4'},{id:'sources',label:'市场',icon:'sources',count:'5'},
    {id:'projects',label:'项目',icon:'projects',count:'2'},{id:'upgrades',label:'更新',icon:'upgrades',count:'3'},
    {id:'doctor',label:'体检',icon:'doctor',count:'1'},{id:'settings',label:'设置',icon:'settings',count:''},
  ];
  const META = {
    overview:{c:'第 412 次扫描 · '+new Date().getFullYear(),kicker:'收拢 · 分发 · 升级',h:'你的 Skill 现在长什么样',dek:'从 3,412 个目录里认出 42 份实体；它们指向 4 个落点、被 5 个客户端读取。下面是今天真正需要你决定的四件事。'},
    library:{c:'我的 Skill',kicker:'一份实体，多个落点',h:'42 份实体',dek:'同一份内容只存一次，各客户端看到的是链接。改动一份，所有落点一起生效；升级前自动备份。'},
    discover:{c:'发现',kicker:'磁盘上有，苍鹭还没接管',h:'6 处待定',dek:'收拢会先备份、再改链接；重复内容按 hash 自动合并，病态嵌套只报告不改动。'},
    sources:{c:'市场',kicker:'五个市场 · 两种能力',h:'从外面带 Skill 进来',dek:'可搜索的市场直接装；只能浏览的市场在浏览器里看好，回来粘贴 git 地址。'},
    projects:{c:'项目',kicker:'落点即行为',h:'客户端到底读哪里',dek:'落点就是客户端真正读取的目录。全局落点影响所有项目；项目落点只影响那一个项目。'},
    upgrades:{c:'更新',kicker:'三方合并',h:'两边改的都留下',dek:'本地改动与上游改动都保留；同一区域两边都改过的文件停在原地，等你逐文件拍板。'},
    doctor:{c:'体检',kicker:'只读检查',h:'坏链、嵌套、frontmatter',dek:'体检不会改动任何文件；发现的问题会给出一条建议操作，而不是自动替你决定。'},
    settings:{c:'设置',kicker:'外观与系统',h:'设置',dek:'主题、语言、应用更新与客户端能力，改动立即生效。'},
  };
  const visibleSkills = computed(()=>SKILLS.filter(s=>{
    if (query.value && !(s.slug+' '+s.name+' '+s.desc).toLowerCase().includes(query.value.toLowerCase())) return false;
    if (filter.value==='issues') return ['cursor','codex'].some(c=>['shadowed','broken','not_scanned'].includes(s.vis[c]));
    return true;
  }));
  const MARKET_ITEMS = [
    { key:'skills.sh/anthropics/pdf', summary:'PDF 抽取、合并与表单填写，附带 OCR 流程', ver:'1.5.0' },
    { key:'skills.sh/anthropics/docx', summary:'读写 .docx，保留批注与修订', ver:'1.0.0' },
    { key:'clawhub/pdf-tools', summary:'轻量 PDF 工具集，仅合并与拆分', ver:'0.3.2' },
  ];
  const meta = computed(()=>META[view.value] || META.overview);
  const pending = computed(()=>4);
  function go(v){ view.value=v; try{history.replaceState(null,'','#'+v)}catch(e){} }
  function toggleTheme(){ theme.value = theme.value==='dark'?'light':'dark'; localStorage.setItem('heron.theme', theme.value); }
  function say(text){ toast.value={text}; setTimeout(()=>{toast.value=null}, 2600); }
  function toggleSel(slug){ selected.value = selected.value.includes(slug)? selected.value.filter(s=>s!==slug) : [...selected.value, slug]; }
  function projectSelected(){ say(selected.value.length+' 个 Skill 已投影'); dialog.value=null; }
  function visCls(x){ return x==='visible' ? 'on' : (x==='broken' ? 'bad' : (x==='shadowed' ? 'warn' : '')); }
  onMounted(()=>{ window.addEventListener('hashchange', ()=>{ const v=(location.hash||'#overview').slice(1); if(NAV.some(n=>n.id===v)) view.value=v; }); });
  return { theme, view, go, toggleTheme, NAV, SKILLS, DETECTED, TARGETS, UPGRADES, ISSUES, PROJECTS, MARKETS, MARKET_ITEMS,
    query, filter, selected, drawer, toast, activeMarket, marketQuery, dialog, adoptKeep, visibleSkills, meta, pending,
    say, toggleSel, projectSelected, visCls, ICON, UP_LABEL, KIND_LABEL };
};
const UP_LABEL = { has_update:'有更新', diverged:'双向改动', local_modified:'本地已改', up_to_date:'已是最新', not_tracked:'未追踪', pinned:'已锁定' };
const KIND_LABEL = { skill:'Skill', 'legacy-command':'旧命令', 'nested-suspect':'病态嵌套' };
let ref, computed, reactive, onMounted;
const BP = { setup: BP_SETUP, template: document.getElementById('bp-tpl').textContent };
</script>

const ICON = JSON.parse(document.getElementById('icon-data').textContent);
</script>
