[workspace]
resolver = "2"
members = [
    "crates/heron-core",
    "crates/heron-platform",
    "crates/heron-store",
    "crates/heron-scan",
    "crates/heron-vcs",
    "crates/heron-git",
    "crates/heron-source",
    "crates/heron-projection",
    "crates/heron-service",
    "crates/heron-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
semver = "1"
directories = "6"
dunce = "1"
fs4 = "1.1"
blake3 = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_yaml = "0.9"
clap = { version = "4.6", features = ["derive"] }
walkdir = "2"
rayon = "1"
globset = "0.4"
toml = "0.8"
ureq = "2"
tempfile = "3"
