<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heron · 方向三 · 信息密集台</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('heron.theme') || 'light');</script>
<style>
:root{
  --h-bg:#090807;--h-panel:#0F0E0C;--h-raised:#151310;--h-line:rgba(246,240,230,.08);
  --h-line2:rgba(246,240,230,.16);--h-text:#EFE8DA;--h-dim:#8A8275;--h-faint:#5A544B;
  --h-ink:#181410;--h-good:#B2C77A;--h-warn:#E3C08A;--h-bad:#E47B66;--h-vit:#9EA8FF;
  --h-sans:"Manrope",-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
  --h-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --h-serif:"EB Garamond","Songti SC",Georgia,serif;
  color-scheme:dark;
}
[data-theme="light"]{
  --h-bg:#FAF9F6;--h-panel:#FFFFFF;--h-raised:#F5F2EC;--h-line:#E8E3DA;--h-line2:#D6CFC3;
  --h-text:#211D18;--h-dim:#6F685D;--h-faint:#A29A8C;
  --h-ink:#FFFFFF;--h-good:#5C7A2E;--h-warn:#8A6216;--h-bad:#A8452F;--h-vit:#4B4BC2;
  color-scheme:light;
}
.h-body{background:var(--h-bg);color:var(--h-text);font-family:var(--h-sans);overflow:hidden}
.h-shell{display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:1fr;height:100vh;overflow:hidden}
@media (max-width:880px){ .h-shell{grid-template-columns:1fr} }
[data-rail]{display:none}
@media (max-width:880px){ [data-rail]{display:none !important} }
/* rail */
.h-rail{display:flex;flex-direction:column;min-height:0;background:var(--h-panel);border-right:1px solid var(--h-line);padding:0 10px 10px}
.h-rail-head{display:flex;align-items:center;gap:9px;padding:15px 6px 12px}
.h-seal{width:25px;height:25px;border-radius:5px;background:var(--h-text);color:var(--h-bg);display:grid;place-items:center;flex:none}
.h-seal svg{width:15px;height:15px}
.h-wordmark{display:flex;flex-direction:column;line-height:1.12}
.h-wordmark b{font-family:var(--h-serif);font-size:16px;font-weight:600;letter-spacing:.01em}
.h-wordmark small{font-size:10px;color:var(--h-dim);letter-spacing:.08em}
.h-search{display:flex;align-items:center;gap:8px;height:32px;padding:0 9px;margin:2px 0 10px;border:1px solid var(--h-line);border-radius:7px;color:var(--h-dim);font-size:12px;background:var(--h-raised)}
.h-search kbd{margin-left:auto;font-family:var(--h-mono);font-size:10px;color:var(--h-faint);border:1px solid var(--h-line);border-radius:4px;padding:1px 4px}
.h-rail-scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:1px;scrollbar-width:thin}
.h-group{font-family:var(--h-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--h-faint);padding:14px 8px 5px}
.h-nav{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:6px;font-size:12.5px;color:var(--h-dim);position:relative;text-align:left;width:100%}
.h-nav svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5}
.h-nav:hover{background:var(--h-raised);color:var(--h-text)}
.h-nav.is-active{background:var(--h-raised);color:var(--h-text);font-weight:600}
.h-nav.is-active::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--h-vit)}
.h-count{margin-left:auto;font-family:var(--h-mono);font-size:10.5px;color:var(--h-dim);min-width:16px;text-align:right}
.h-count.tone-warn{color:var(--h-warn)} .h-count.tone-bad{color:var(--h-bad)}
.h-rail-foot{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--h-line)}
.h-health{display:flex;gap:7px;flex-wrap:wrap;padding:0 4px}
.h-dot{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--h-dim)}
.h-dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--h-faint)}
.h-dot.good::before{background:var(--h-good)} .h-dot.warn::before{background:var(--h-warn)} .h-dot.bad::before{background:var(--h-bad)}
.h-theme{margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border:1px solid var(--h-line);border-radius:999px;font-size:11px;color:var(--h-dim)}
.h-theme svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6}
.h-main{display:flex;flex-direction:column;min-width:0;min-height:0}
/* topbar */
.h-topbar{display:flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-bottom:1px solid var(--h-line);flex:none;background:var(--h-bg);z-index:5}
.h-crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--h-faint);white-space:nowrap;overflow:hidden}
.h-crumbs b{color:var(--h-text);font-weight:600}
.h-topbar .sp{flex:1}
.h-btn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:7px;font-size:12.5px;font-weight:500;border:1px solid var(--h-line2);color:var(--h-text);white-space:nowrap}
.h-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.h-btn:hover{background:var(--h-raised)}
.h-btn.primary{background:var(--h-text);border-color:var(--h-text);color:var(--h-bg)}
.h-btn.primary:hover{opacity:.9}
.h-btn:disabled{opacity:.45;cursor:default}
.h-view{padding:24px 28px 40px;overflow:auto;flex:1;min-height:0;position:relative}
.h-view-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.h-h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.h-h1 .idx{font-family:var(--h-mono);font-size:11px;color:var(--h-faint);margin-right:8px;font-weight:500;vertical-align:2px}
.h-lead{margin:6px 0 0;color:var(--h-dim);font-size:13px}
.h-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* surfaces */
.h-card{background:var(--h-panel);border:1px solid var(--h-line);border-radius:10px}
.h-card-h{display:flex;align-items:center;gap:8px;padding:12px 15px;border-bottom:1px solid var(--h-line)}
.h-card-h h3{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.02em}
.h-card-h .r{margin-left:auto;display:flex;align-items:center;gap:8px}
.h-card-b{padding:14px 15px}
.h-sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.h-sec h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.02em}
.h-sec .line{flex:1;height:1px;background:var(--h-line)}
/* chips */
.h-chip{display:inline-flex;align-items:center;gap:6px;height:21px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.h-chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.9;flex:none}
.h-chip.good{color:var(--h-good);background:color-mix(in srgb,var(--h-good) 12%,transparent)}
.h-chip.warn{color:var(--h-warn);background:color-mix(in srgb,var(--h-warn) 12%,transparent)}
.h-chip.bad{color:var(--h-bad);background:color-mix(in srgb,var(--h-bad) 12%,transparent)}
.h-chip.neutral{color:var(--h-dim);background:var(--h-raised);border-color:var(--h-line)}
.h-chip.vit{color:var(--h-vit);background:color-mix(in srgb,var(--h-vit) 12%,transparent)}
.h-chip.plain::before{display:none}
.h-mono{font-family:var(--h-mono);font-size:11.5px;color:var(--h-dim)}
.h-path{font-family:var(--h-mono);font-size:11px;color:var(--h-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr}
.h-muted{color:var(--h-dim)}
/* rows / table */
.h-table{width:100%;border-collapse:separate;border-spacing:0}
.h-table th{text-align:left;font-family:var(--h-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--h-faint);font-weight:500;padding:0 12px 8px;border-bottom:1px solid var(--h-line)}
.h-table td{padding:9px 12px;border-bottom:1px solid var(--h-line);font-size:12.5px;vertical-align:middle}
.h-table tbody tr{cursor:pointer}
.h-table tbody tr:hover td{background:var(--h-raised)}
.h-table tbody tr.is-sel td{background:color-mix(in srgb,var(--h-vit) 9%,transparent)}
.h-table tr:last-child td{border-bottom:0}
/* checkbox */
.h-cb{appearance:none;width:15px;height:15px;border:1px solid var(--h-line2);border-radius:4px;background:transparent;display:inline-grid;place-items:center;cursor:pointer;margin:0;flex:none}
.h-cb:checked{background:var(--h-text);border-color:var(--h-text)}
.h-cb:checked::after{content:"";width:8px;height:4px;border-left:1.8px solid var(--h-bg);border-bottom:1.8px solid var(--h-bg);transform:rotate(-45deg) translateY(-1px)}
.h-switch{position:relative;width:30px;height:17px;border-radius:999px;background:var(--h-line2);cursor:pointer;flex:none;transition:background .15s}
.h-switch::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--h-panel);transition:transform .15s}
.h-switch.on{background:var(--h-text)}
.h-switch.on::after{transform:translateX(13px)}
/* toast */
.h-toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:50;align-items:flex-end}
.h-toast{display:flex;align-items:center;gap:9px;max-width:420px;padding:10px 13px;border-radius:8px;font-size:12.5px;border:1px solid var(--h-line2);box-shadow:0 12px 32px rgba(0,0,0,.35)}
.h-toast.ok{background:var(--h-panel);color:var(--h-text);border-left:3px solid var(--h-good)}
.h-toast.warn{border-left:3px solid var(--h-warn)} .h-toast.error{border-left:3px solid var(--h-bad)}
.h-toast .x{margin-left:6px;color:var(--h-faint);font-size:14px}
/* dialog */
.h-overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--h-bg) 62%,transparent);backdrop-filter:blur(3px);z-index:40;display:grid;place-items:center;padding:24px}
.h-dialog{width:min(560px,100%);background:var(--h-panel);border:1px solid var(--h-line2);border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.h-dialog-h{padding:16px 18px 6px}
.h-dialog-h h3{margin:0;font-size:15px}
.h-dialog-h p{margin:6px 0 0;color:var(--h-dim);font-size:12.5px}
.h-dialog-b{padding:14px 18px 18px}
.h-dialog-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--h-line)}
.h-tabs{display:flex;gap:4px;border-bottom:1px solid var(--h-line);padding:0 18px}
.h-tab{height:34px;font-size:12.5px;color:var(--h-dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.h-tab.is-active{color:var(--h-text);border-bottom-color:var(--h-text);font-weight:600}
.h-tab .n{font-family:var(--h-mono);font-size:10.5px;margin-left:5px;color:var(--h-faint)}
/* drawer */
.h-drawer-mask{position:fixed;inset:0;background:color-mix(in srgb,var(--h-bg) 55%,transparent);backdrop-filter:blur(2px);z-index:38}
.h-drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,92vw);background:var(--h-panel);border-left:1px solid var(--h-line2);z-index:39;display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(0,0,0,.35)}
.h-drawer-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--h-line)}
.h-drawer-b{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.h-drawer-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--h-line)}
.h-close{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--h-dim);margin-left:auto}
.h-close:hover{background:var(--h-raised);color:var(--h-text)}
/* misc */
.h-kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:12.5px}
.h-kv dt{color:var(--h-dim)} .h-kv dd{margin:0}
.h-empty{padding:34px 16px;text-align:center;color:var(--h-dim);font-size:13px}
.h-bar{height:4px;border-radius:4px;background:var(--h-line2);overflow:hidden}
.h-bar i{display:block;height:100%;background:var(--h-text);border-radius:4px}
.h-link{color:var(--h-vit);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--h-vit) 40%,transparent)}
.h-code{font-family:var(--h-mono);font-size:11.5px;line-height:1.65;background:var(--h-raised);border:1px solid var(--h-line);border-radius:8px;padding:12px;margin:0;overflow:auto;white-space:pre}
.h-split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1100px){ .h-split{grid-template-columns:1fr} }
.h-field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--h-dim)}
.h-input{height:32px;padding:0 10px;border:1px solid var(--h-line2);border-radius:7px;background:var(--h-raised);color:var(--h-text);font-size:12.5px;outline:none;width:100%}
.h-input:focus{border-color:var(--h-text)}
.h-seg{display:inline-flex;border:1px solid var(--h-line2);border-radius:7px;overflow:hidden}
button{font:inherit;border:0;background:none;padding:0;color:inherit;cursor:pointer;line-height:normal}
input[type=checkbox]{-webkit-appearance:none;appearance:none}
.h-seg button{height:26px;padding:0 9px;font-size:11.5px;color:var(--h-dim)}
.h-seg button.is-active{background:var(--h-text);color:var(--h-bg);font-weight:600}
</style>
<style>
/* ---- DIRECTION 3 · Swiss dense ---- */
.s3{--bg:#F7F7F5;--fg:#111110;--bg2:#E6E6E2;--line:#D3D3CE;--line2:#BDBDB7;--dim:#6B6B66;--faint:#9A9A94;--lt:#FDFDFC;--mark:#E8482B;
 font-family:Inter,-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;color:var(--fg);font-size:13.5px;letter-spacing:-.005em}
.s3[data-theme="dark"]{--bg:#0B0B0C;--fg:#F0F0ED;--bg2:#17171A;--line:#26262B;--line2:#3A3A40;--dim:#9A9AA2;--faint:#6A6A72;--lt:#121215;--mark:#FF6A4D;color-scheme:dark}
.s3 *{box-sizing:border-box}
.s3 :where(button){font:inherit;border:0;background:none;padding:0;color:inherit;cursor:pointer;line-height:normal}
.s3 .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;letter-spacing:.02em}
.s3 .lbl{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.s3 .num{font-family:Inter;font-variant-numeric:tabular-nums;letter-spacing:-.045em;font-weight:600}
.s3 .info{display:grid;grid-template-columns:52px minmax(0,1fr);min-height:100vh;background:var(--bg)}
.s3 .iband{background:var(--bg2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px}
.s3 .ilogo{width:32px;height:32px;display:grid;place-items:center;background:var(--fg);color:var(--bg);margin-bottom:10px}
.s3 .ilogo svg{width:18px;height:18px}
.s3 .inav{display:flex;flex-direction:column;align-items:center;width:100%;gap:2px}
.s3 .inav button{width:100%;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);border-left:2px solid transparent}
.s3 .inav button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
.s3 .inav button span{font-family:"JetBrains Mono",monospace;font-size:8px;letter-spacing:.06em}
.s3 .inav button:hover{color:var(--fg)}
.s3 .inav button.on{color:var(--fg);border-left-color:var(--mark);background:var(--bg)}
.s3 .iband .sp{flex:1}
.s3 .itg{width:30px;height:30px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--dim)}
.s3 .itg svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.s3 .main{display:flex;flex-direction:column;min-width:0}
.s3 .mast{display:flex;align-items:flex-end;gap:15px;padding:14px 26px 12px;border-bottom:1px solid var(--line)}
.s3 .mast .ht{font-weight:600;font-size:20px;letter-spacing:-.02em;margin:0;white-space:nowrap}
.s3 .mast .sub{color:var(--dim);font-size:12px;padding-bottom:1px;line-height:1.4}
.s3 .mast .sp{flex:1}
.s3 .ticker{display:flex;align-items:center;gap:14px;padding:7px 26px;border-bottom:1px solid var(--line);font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--dim);flex-wrap:wrap;background:var(--lt)}
.s3 .ticker b{color:var(--fg);font-weight:500}
.s3 .ticker .sep{width:1px;height:10px;background:var(--line2)}
.s3 .ticker .sp{flex:1}
.s3 .content{padding:0 26px 30px;overflow:auto;flex:1}
.s3 .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));border-top:1px solid var(--line2);margin-top:18px}
.s3 .r{display:contents}
.s3 .c{border-bottom:1px solid var(--line);padding:12px 16px 14px;min-height:120px}
.s3 .s4{grid-column:span 4}.s3 .s3{grid-column:span 3}.s3 .s6{grid-column:span 6}.s3 .s9{grid-column:span 9}.s3 .s12{grid-column:span 12}.s3 .s8{grid-column:span 8}
.s3 .c+.c{border-left:1px solid var(--line)}
.s3 .c .cap{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.s3 .c .cap .n{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--faint)}
.s3 .figure{font-size:44px;line-height:1;letter-spacing:-.05em;font-weight:600;font-variant-numeric:tabular-nums}
.s3 .figure.small{font-size:26px}
.s3 .unit{font-size:12px;color:var(--dim);margin-left:6px;font-weight:400;letter-spacing:0;font-style:normal}
.s3 .desc{color:var(--dim);font-size:12px;line-height:1.55;margin-top:10px}
.s3 .stage{list-style:none;margin:0;padding:0}
.s3 .stage li{display:grid;grid-template-columns:20px 56px 1fr auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dotted var(--line2);font-size:12.5px}
.s3 .stage li:last-child{border-bottom:0}
.s3 .stage .i{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--faint)}
.s3 .stage .k{color:var(--dim);font-size:11.5px}
.s3 .stage .v{text-align:right;font-variant-numeric:tabular-nums}
.s3 .stage li.warn .v{color:var(--mark)}
.s3 .bar{height:6px;background:var(--bg2);border:1px solid var(--line2);margin-top:8px;position:relative}
.s3 .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--fg)}
.s3 .bar.warn i{background:var(--mark)}
.s3 table.dt{width:100%;border-collapse:collapse}
.s3 table.dt th{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:400;text-align:left;padding:0 8px 7px;border-bottom:1px solid var(--line2);white-space:nowrap}
.s3 table.dt td{padding:8px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
.s3 table.dt tbody tr:hover td{background:var(--lt)}
.s3 table.dt tr.sel td{background:color-mix(in srgb,var(--mark) 7%,transparent)}
.s3 .mini{display:grid;grid-template-columns:repeat(4,7px);gap:2px}
.s3 .mini i{width:7px;height:7px;border:1px solid var(--line2);display:block}
.s3 .mini i.on{background:var(--fg);border-color:var(--fg)}
.s3 .mini i.warn{background:var(--mark);border-color:var(--mark)}
.s3 .mini i.no{border-style:dashed;border-color:var(--line2)}
.s3 .cb{appearance:none;-webkit-appearance:none;width:13px;height:13px;border:1px solid var(--line2);display:inline-grid;place-items:center;margin:0;cursor:pointer;background:transparent}
.s3 .cb:checked{background:var(--mark);border-color:var(--mark)}
.s3 .cb:checked::after{content:"";width:6px;height:3px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.s3 .btn{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 10px;border:1px solid var(--line2);font-size:12px;white-space:nowrap;background:var(--bg)}
.s3 .btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6}
.s3 .btn:hover{background:var(--bg2)}
.s3 .btn.dark{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.s3 .btn.mark{background:var(--mark);border-color:var(--mark);color:#fff}
.s3 .btn:disabled{opacity:.4}
.s3 .btn.gh{color:var(--dim)}
.s3 .tag{display:inline-flex;align-items:baseline;gap:5px;font-family:"JetBrains Mono",monospace;font-size:10px;padding:1px 5px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.s3 .tag::before{content:"";width:4px;height:4px;background:currentColor;transform:translateY(-1px)}
.s3 .tag.ok{color:var(--fg);border-color:var(--line2)}
.s3 .tag.warn{color:var(--mark);border-color:color-mix(in srgb,var(--mark) 50%,transparent)}
.s3 .tag.no{color:var(--faint);border-style:dashed}
.s3 .toast{position:fixed;right:22px;bottom:20px;display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--fg);color:var(--bg);font-size:12px;z-index:60}
.s3 .dlg-mask{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:blur(2px);z-index:30;display:grid;place-items:center;padding:24px}
.s3 .dlg{background:var(--bg);border:1px solid var(--line2);width:min(920px,100%);box-shadow:0 24px 60px rgba(0,0,0,.25)}
.s3 .dlg h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--line2);font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}
.s3 .dlg .db{padding:14px 16px}
.s3 .dlg .df{padding:10px 16px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end}
.s3 .pre{margin:0;background:var(--bg2);border:1px solid var(--line);padding:10px 12px;font-family:"JetBrains Mono",monospace;font-size:11px;line-height:1.7;white-space:pre-wrap}
.s3 .split{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
.s3 .split>div{padding:10px 12px}.s3 .split>div+div{border-left:1px solid var(--line)}
.s3 .seg{display:inline-flex;border:1px solid var(--line2)}
.s3 .seg button{height:25px;padding:0 9px;font-size:11.5px;color:var(--dim)}
.s3 .seg button.on{background:var(--fg);color:var(--bg)}
.s3 .fld{height:29px;border:1px solid var(--line2);padding:0 9px;background:var(--bg);color:var(--fg);font-size:12.5px;outline:none;min-width:0}
.s3 .fld:focus{border-color:var(--fg)}
.s3 .sw{width:28px;height:15px;border:1px solid var(--line2);position:relative;cursor:pointer;flex:none}
.s3 .sw::after{content:"";position:absolute;top:2px;left:2px;width:9px;height:9px;background:var(--dim);transition:transform .12s}
.s3 .sw.on{border-color:var(--mark)} .s3 .sw.on::after{transform:translateX(13px);background:var(--mark)}
.s3 .logs{font-family:"JetBrains Mono",monospace;font-size:11px;line-height:1.9;color:var(--dim)}
.s3 .logs b{color:var(--fg);font-weight:500}
.s3 .mnav{display:none}
@media (max-width:1000px){
 .s3 .info{grid-template-columns:1fr}
 .s3 .iband{display:none}
 .s3 .mast{padding:12px 16px 10px;flex-wrap:wrap}
 .s3 .ticker{padding:6px 16px}
 .s3 .content{padding:0 16px 70px}
 .s3 .s4,.s3 .s3,.s3 .s6,.s3 .s9,.s3 .s8{grid-column:span 12}
 .s3 .c+.c{border-left:0}
 .s3 .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line2);z-index:20;justify-content:space-around;padding:6px 0 8px}
 .s3 .mnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:"JetBrains Mono",monospace;font-size:8.5px;color:var(--dim)}
 .s3 .mnav button.on{color:var(--fg)} .s3 .mnav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
}
</style>

<script type="text/plain" id="d3-tpl">
<div class="s3" :data-theme="theme">
<div class="info">
  <aside class="iband">
    <div class="ilogo"><span v-html="ICON.overview"></span></div>
    <nav class="inav">
      <button v-for="it in NAV" :key="it.id" :class="{on:view===it.id}" @click="go(it.id)" :title="it.label"><span v-html="ICON[it.icon]"></span><span v-text="it.code"></span></button>
    </nav>
    <div class="sp"></div>
    <button class="itg" @click="toggleTheme" :title="theme==='dark'?'浅色':'深色'"><span v-html="ICON[theme==='dark'?'sun':'moon']"></span></button>
  </aside>

  <div class="main">
    <header class="mast">
      <h1 class="ht"><span class="mono" style="color:var(--faint);font-weight:400;margin-right:10px" v-text="code"></span><span v-text="heading"></span></h1>
      <div class="sub" v-text="lead"></div>
      <span class="sp"></span>
      <div style="display:flex;gap:6px">
        <button class="btn" @click="say('扫描完成 · 3,412 目录 · 1.1s')"><span v-html="ICON.refresh"></span>扫描</button>
        <button class="btn dark" @click="say('36 个投影校验完毕')"><span v-html="ICON.check"></span>校验</button>
      </div>
    </header>
    <div class="ticker">
      <span>扫描 <b>8 分钟前</b></span><span class="sep"></span>
      <span>git <b>2.45</b></span><span class="sep"></span>
      <span>锁文件 <b>heron.lock</b></span><span class="sep"></span>
      <span>数据目录 <b>~/Library/Application Support/Heron</b></span>
      <span class="sp"></span>
      <span>待处理 <b style="color:var(--mark)"><span v-text="pending"></span></b></span>
    </div>

    <div class="content">
      <!-- OVERVIEW -->
      <div v-if="view==='overview'" class="grid">
        <div class="c s3"><div class="cap"><span class="lbl">纳管</span><span class="n">01</span></div><div class="figure">42<em class="unit">份实体</em></div><div class="desc">同一份内容只存一次；各客户端看到的是链接。</div></div>
        <div class="c s3"><div class="cap"><span class="lbl">落点</span><span class="n">02</span></div><div class="figure">4<em class="unit">个</em></div><div class="desc">覆盖 Claude Code / Codex / Agents / Cursor / opencode。</div></div>
        <div class="c s3"><div class="cap"><span class="lbl">待升级</span><span class="n">03</span></div><div class="figure">3<em class="unit">个</em></div><div class="desc">其中 1 个两侧都改过，需要逐文件合并。</div></div>
        <div class="c s3"><div class="cap"><span class="lbl">坏链</span><span class="n">04</span></div><div class="figure" style="color:var(--mark)">1<em class="unit">处</em></div><div class="desc">slides 在 Cursor 里指向不存在的目录。</div></div>

        <div class="c s6">
          <div class="cap"><span class="lbl">三步流水线</span><span class="n">05</span></div>
          <ul class="stage">
            <li><span class="i">01</span><span>收拢</span><span class="k">42 份实体 · 6 处重复按 hash 合并</span><span class="v">86%</span></li>
            <li><span class="i">02</span><span>分发</span><span class="k">36 处投影 · 2 处被压制</span><span class="v">74%</span></li>
            <li class="warn"><span class="i">03</span><span>升级</span><span class="k">3 待升级 · 1 待合并（pdf）</span><span class="v">42%</span></li>
          </ul>
          <div class="bar"><i style="width:76%"></i></div>
          <div class="bar warn" style="margin-top:4px"><i style="width:42%"></i></div>
          <div class="desc">最近一次完整流水线：今天 09:14。</div>
        </div>
        <div class="c s6">
          <div class="cap"><span class="lbl">需要你决定</span><span class="n">06</span></div>
          <ul class="stage">
            <li class="warn"><span class="i">A</span><span>体检</span><span class="k">slides 在 Cursor 是坏链</span><span class="v"><button class="btn" style="height:22px" @click="go('doctor')">处理</button></span></li>
            <li><span class="i">B</span><span>更新</span><span class="k">pdf 本地与上游都改过</span><span class="v"><button class="btn" style="height:22px" @click="go('upgrades')">合并</button></span></li>
            <li><span class="i">C</span><span>发现</span><span class="k">4 处未纳管</span><span class="v"><button class="btn" style="height:22px" @click="go('discover')">收拢</button></span></li>
            <li><span class="i">D</span><span>更新</span><span class="k">docx、slides 可升级</span><span class="v"><button class="btn" style="height:22px" @click="go('upgrades')">升级</button></span></li>
          </ul>
        </div>
        <div class="c s12">
          <div class="cap"><span class="lbl">操作日志</span><span class="n">07</span></div>
          <div class="logs">
            <div><b>09:12</b> adopt 　pdf × 2 → store/pdf，原位置已改为链接</div>
            <div><b>昨天 18:40</b> project　docx → ~/.codex/skills</div>
            <div><b>11-18</b> upgrade　slides 0.3.9 → 0.4.1 · 3 files</div>
            <div><b>11-17</b> resolve　xlsx 冲突：2 上游 / 1 本地</div>
          </div>
        </div>
      </div>

      <!-- LIBRARY -->
      <div v-else-if="view==='library'" class="grid">
        <div class="c s12" style="min-height:0">
          <div class="cap"><span class="lbl">我的 Skill</span><span class="n" v-text="visibleSkills.length + ' / ' + SKILLS.length"></span>
            <span style="flex:1"></span>
            <input class="fld" v-model="query" placeholder="搜索名称 / 描述" style="width:200px;height:25px;font-size:12px">
            <span class="seg" style="margin-left:6px"><button :class="{on:filter==='all'}" @click="filter='all'">全部</button><button :class="{on:filter==='issues'}" @click="filter='issues'">有问题</button></span>
            <button class="btn dark" style="margin-left:6px" :disabled="!selected.length" @click="dialog='project'">投影到…<span v-if="selected.length" class="mono" style="margin-left:4px" v-text="'(' + selected.length + ')'"></span></button>
          </div>
          <table class="dt">
            <thead><tr><th style="width:26px"><input type="checkbox" class="cb" :checked="selected.length===visibleSkills.length&&visibleSkills.length>0" @change="selected=selected.length?[]:visibleSkills.map(s=>s.slug)"></th><th>slug</th><th>描述</th><th>版本</th><th>来源</th><th title="Claude / Codex / Cursor / opencode">落点状态</th><th>操作</th></tr></thead>
            <tbody>
              <tr v-for="s in visibleSkills" :key="s.slug" :class="{sel:selected.includes(s.slug)}" @click="drawer=s.slug" style="cursor:pointer">
                <td @click.stop><input type="checkbox" class="cb" :checked="selected.includes(s.slug)" @change="toggleSel(s.slug)"></td>
                <td><b style="font-weight:600" v-text="s.slug"></b></td>
                <td style="color:var(--dim);max-width:320px" v-text="s.desc"></td>
                <td class="mono" v-text="s.ver"></td>
                <td class="mono" v-text="s.origin"></td>
                <td><div class="mini" :title="'claude ' + s.vis.claude + ' / codex ' + s.vis.codex + ' / cursor ' + s.vis.cursor + ' / opencode ' + s.vis.opencode"><i :class="cls(s.vis.claude)"></i><i :class="cls(s.vis.codex)"></i><i :class="cls(s.vis.cursor)"></i><i :class="cls(s.vis.opencode)"></i></div></td>
                <td><button class="btn gh" style="height:23px" @click.stop="drawer=s.slug">详情</button></td>
              </tr>
            </tbody>
          </table>
          <div class="desc">落点状态四格：实心=生效中，朱红=坏链/被压制，虚线=未被扫描。</div>
        </div>
      </div>

      <!-- DISCOVER -->
      <div v-else-if="view==='discover'" class="grid">
        <div class="c s8" style="min-height:0">
          <div class="cap"><span class="lbl">未纳管</span><span class="n" v-text="DETECTED.length"></span></div>
          <table class="dt">
            <thead><tr><th style="width:26px"><input type="checkbox" class="cb" @change="selected=selected.length?[]:DETECTED.filter(d=>d.kind!=='nested-suspect').map(d=>d.path)"></th><th>路径</th><th>客户端</th><th>类型</th><th>评估</th></tr></thead>
            <tbody>
              <tr v-for="d in DETECTED" :key="d.path" :class="{sel:selected.includes(d.path)}">
                <td><input type="checkbox" class="cb" :disabled="d.kind==='nested-suspect'" :checked="selected.includes(d.path)" @change="selected=selected.includes(d.path)?selected.filter(p=>p!==d.path):[...selected,d.path]"></td>
                <td class="mono" v-text="d.path"></td><td v-text="d.client"></td>
                <td><span class="tag" :class="d.kind==='skill'?'ok':'warn'" v-text="KIND_LABEL[d.kind]"></span></td>
                <td><span class="tag" :class="d.fm===false?'warn':'no'" v-text="d.fm===false?'frontmatter 需修复':'可收拢'"></span></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="c s4">
          <div class="cap"><span class="lbl">收拢预览</span><span class="n">dry-run</span></div>
          <pre class="pre">$ heron adopt --dry-run
→ store   副本 × 4（去重 1）
→ link    原位置 → store
→ backup  backup/2026-11-20
跳过 1（hash 相同）
错误 0</pre>
          <div style="display:flex;align-items:center;gap:8px;margin-top:12px"><span class="sw" :class="{on:adoptKeep}" @click="adoptKeep=!adoptKeep"></span><span style="font-size:12px">保留原位置（改为链接）</span></div>
          <div style="display:flex;gap:6px;margin-top:12px"><button class="btn dark" :disabled="!selected.length" @click="dialog='adopt'">执行收拢<span v-if="selected.length" class="mono" style="margin-left:4px" v-text="selected.length"></span></button><button class="btn" @click="say('已忽略病态嵌套','warn')">忽略嵌套</button></div>
        </div>
      </div>

      <!-- SOURCES -->
      <div v-else-if="view==='sources'" class="grid">
        <div class="c s12" style="min-height:0">
          <div class="cap"><span class="lbl">市场</span><span class="n">5</span></div>
          <table class="dt">
            <thead><tr><th>市场</th><th>能力</th><th>默认</th><th>入口</th></tr></thead>
            <tbody>
              <tr v-for="m in MARKETS" :key="m.id" :class="{sel:activeMarket===m.id}" @click="activeMarket=m.id" style="cursor:pointer">
                <td><b style="font-weight:600" v-text="m.name"></b></td>
                <td><span class="tag" :class="m.cap==='indexed'?'ok':'no'" v-text="m.cap==='indexed'?'可搜索 · 可安装':'仅浏览 · 粘贴地址'"></span></td>
                <td class="mono" v-text="m.on?'开启':'关闭'"></td>
                <td class="mono" style="color:var(--dim)" v-text="m.cap==='indexed'?'api':'browser'"></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="c s8" style="min-height:0">
          <div class="cap"><span class="lbl">搜索结果</span><span class="n" v-text="activeMarket"></span></div>
          <div style="display:flex;gap:6px;margin-bottom:10px"><input class="fld" v-model="marketQuery" style="flex:1"><button class="btn dark">搜索</button></div>
          <table class="dt">
            <thead><tr><th>条目</th><th>版本</th><th>装法</th><th></th></tr></thead>
            <tbody><tr v-for="i in MARKET_ITEMS" :key="i.key"><td><b class="mono" style="color:var(--fg)" v-text="i.key"></b><div style="color:var(--dim);font-size:11.5px" v-text="i.summary"></div></td><td class="mono" v-text="i.ver"></td><td><span class="tag ok">git</span></td><td style="text-align:right"><button class="btn dark" style="height:23px" @click="say('已安装到存储区，下一步可投影')">安装</button></td></tr></tbody>
          </table>
        </div>
        <div class="c s4">
          <div class="cap"><span class="lbl">粘贴地址</span><span class="n">git url</span></div>
          <input class="fld" style="width:100%" placeholder="https://github.com/…/pdf">
          <div style="display:flex;gap:6px;margin-top:8px"><button class="btn">预览</button><button class="btn dark">安装</button></div>
          <div class="desc">支持 owner/repo、完整 URL、带子路径的 URL；有歧义时先让你确认。</div>
        </div>
      </div>

      <!-- PROJECTS -->
      <div v-else-if="view==='projects'" class="grid">
        <div class="c s7" style="grid-column:span 7;min-height:0">
          <div class="cap"><span class="lbl">全局落点</span><span class="n">4</span></div>
          <table class="dt"><tbody>
            <tr v-for="t in TARGETS.filter(t=>t.scope==='全局')" :key="t.id"><td style="width:140px"><b style="font-weight:600" v-text="t.kind"></b><span v-if="t.def" class="tag warn" style="margin-left:6px">默认</span></td><td class="mono" v-text="t.path"></td><td style="width:50px;text-align:right"><span class="sw" :class="{on:t.enabled}" @click="t.enabled=!t.enabled"></span></td></tr>
          </tbody></table>
        </div>
        <div class="c s5" style="grid-column:span 5">
          <div class="cap"><span class="lbl">项目落点</span><span class="n" v-text="PROJECTS.length"></span></div>
          <div v-for="p in PROJECTS" :key="p.root" style="padding:8px 0;border-bottom:1px dotted var(--line2)">
            <div class="mono" v-text="p.root"></div>
            <div style="display:flex;gap:5px;margin-top:6px;flex-wrap:wrap"><span class="tag" v-for="c in p.clients" :key="c" v-text="c"></span></div>
          </div>
          <button class="btn" style="margin-top:12px" @click="say('选择项目目录…')"><span v-html="ICON.plus"></span>添加项目</button>
        </div>
      </div>

      <!-- UPGRADES -->
      <div v-else-if="view==='upgrades'" class="grid">
        <div class="c s12" style="min-height:0">
          <div class="cap"><span class="lbl">候选</span><span class="n">3 可升级 · 1 冲突</span><button class="btn dark" style="margin-left:auto;height:24px">全部升级</button></div>
          <table class="dt">
            <thead><tr><th style="width:26px"></th><th>slug</th><th>状态</th><th>本地</th><th>基线</th><th>上游</th><th>来源</th><th></th></tr></thead>
            <tbody>
              <tr v-for="u in UPGRADES" :key="u.slug">
                <td><input type="checkbox" class="cb" :disabled="!['has_update','diverged'].includes(u.state)"></td>
                <td><b style="font-weight:600" v-text="u.slug"></b></td>
                <td><span class="tag" :class="['diverged','local_modified'].includes(u.state)?'warn':'ok'" v-text="UP_LABEL[u.state]"></span></td>
                <td class="mono" v-text="u.installed"></td><td class="mono" v-text="u.baseline"></td><td class="mono" v-text="u.latest||'—'"></td>

<script>
const D3_SETUP = function(){
  const theme = ref(localStorage.getItem('heron.theme') || 'light');
  const view = ref(((location.hash||'#overview').slice(1).split('?')[0]) || 'overview');
  const query = ref(''); const filter = ref('all'); const selected = ref([]); const drawer = ref(null); const toast = ref(null);
  const activeMarket = ref('skills_sh'); const marketQuery = ref('pdf'); const dialog = ref(null); const adoptKeep = ref(true);
  const NAV = [
    {id:'overview',label:'概览',icon:'overview',code:'OVW'},{id:'library',label:'我的 Skill',icon:'library',code:'LIB'},
    {id:'discover',label:'发现',icon:'discover',code:'DSC'},{id:'sources',label:'来源与市场',icon:'sources',code:'SRC'},
    {id:'projects',label:'项目与落点',icon:'projects',code:'PRJ'},{id:'upgrades',label:'更新',icon:'upgrades',code:'UPG'},
    {id:'doctor',label:'体检',icon:'doctor',code:'DOC'},{id:'settings',label:'设置',icon:'settings',code:'SET'},
  ];
  const META = {
    overview:{c:'01',h:'概览',l:'收拢 · 分发 · 升级，三步流水线在这里结账。'},
    library:{c:'02',h:'我的 Skill',l:'一份实体，多个落点；改一处即全部生效。'},
    discover:{c:'03',h:'发现',l:'磁盘上有、苍鹭还没接管的 Skill；先预览再收拢。'},
    sources:{c:'04',h:'来源与市场',l:'五个市场：两个可搜索直装，三个只提供浏览器浏览。'},
    projects:{c:'05',h:'项目与落点',l:'落点是客户端真正读取的目录，项目落点只对该项目生效。'},
    upgrades:{c:'06',h:'更新',l:'三方合并：两边改动都保留，合不上的由你逐文件决定。'},
    doctor:{c:'07',h:'体检',l:'只读检查：重复、坏链、病态嵌套、来源丢失。'},
    settings:{c:'08',h:'设置',l:'外观、语言、应用更新与客户端能力。'},
  };
  const visibleSkills = computed(()=>SKILLS.filter(s=>{
    if (query.value && !(s.slug+' '+s.name+' '+s.desc).toLowerCase().includes(query.value.toLowerCase())) return false;
    if (filter.value==='issues') return ['cursor','codex'].some(c=>['shadowed','broken','not_scanned'].includes(s.vis[c]));
    return true;
  }));
  const MARKET_ITEMS = [
    { key:'skills.sh/anthropics/pdf', summary:'PDF 抽取、合并与表单填写，附带 OCR 流程', ver:'1.5.0' },
    { key:'skills.sh/anthropics/docx', summary:'读写 .docx，保留批注与修订', ver:'1.0.0' },
    { key:'clawhub/pdf-tools', summary:'轻量 PDF 工具集，仅合并与拆分', ver:'0.3.2' },
  ];
  const metadata = computed(()=>META[view.value] || META.overview);
  const code = computed(()=>metadata.value.c);
  const heading = computed(()=>metadata.value.h);
  const lead = computed(()=>metadata.value.l);
  const pending = computed(()=>4);
  function go(v){ view.value=v; try{history.replaceState(null,'','#'+v)}catch(e){} }
  function toggleTheme(){ theme.value = theme.value==='dark'?'light':'dark'; localStorage.setItem('heron.theme', theme.value); }
  function say(text){ toast.value={text}; setTimeout(()=>{toast.value=null}, 2600); }
  function toggleSel(slug){ selected.value = selected.value.includes(slug)? selected.value.filter(s=>s!==slug) : [...selected.value, slug]; }
  function projectSelected(){ say(selected.value.length+' 个 Skill 已投影'); dialog.value=null; }
  function cls(x){ return x==='visible'?'on':(x==='broken'||x==='shadowed')?'warn':'no'; }
  onMounted(()=>{ window.addEventListener('hashchange', ()=>{ const v=(location.hash||'#overview').slice(1); if(NAV.some(n=>n.id===v)) view.value=v; }); });
  return { theme, view, go, toggleTheme, NAV, SKILLS, DETECTED, TARGETS, UPGRADES, ISSUES, PROJECTS, MARKETS, MARKET_ITEMS,
    query, filter, selected, drawer, toast, activeMarket, marketQuery, dialog, adoptKeep, visibleSkills, metadata, code, heading, lead, pending,
    say, toggleSel, projectSelected, cls, ICON, UP_LABEL, KIND_LABEL };
};
const UP_LABEL = { has_update:'有更新', diverged:'双向改动', local_modified:'本地已改', up_to_date:'已是最新', not_tracked:'未追踪', pinned:'已锁定' };
const KIND_LABEL = { skill:'Skill', 'legacy-command':'旧命令', 'nested-suspect':'病态嵌套' };
let ref, computed, reactive, onMounted;
const D3 = { setup: D3_SETUP, template: document.getElementById('d3-tpl').textContent };
</script>

const ICON = JSON.parse(document.getElementById('icon-data').textContent);
</script>
