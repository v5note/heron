[workspace]
resolver = "2"
members = [
    "crates/heron-core",
    "crates/heron-platform",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
semver = "1"
directories = "6"
dunce = "1"
fs4 = "1.1"
tempfile = "3"
