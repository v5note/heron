<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heron · 方向二 · 田中几何册</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('heron.theme') || 'light');</script>
<style>
:root{
  --h-bg:#090807;--h-panel:#0F0E0C;--h-raised:#151310;--h-line:rgba(246,240,230,.08);
  --h-line2:rgba(246,240,230,.16);--h-text:#EFE8DA;--h-dim:#8A8275;--h-faint:#5A544B;
  --h-ink:#181410;--h-good:#B2C77A;--h-warn:#E3C08A;--h-bad:#E47B66;--h-vit:#9EA8FF;
  --h-sans:"Manrope",-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
  --h-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --h-serif:"EB Garamond","Songti SC",Georgia,serif;
  color-scheme:dark;
}
[data-theme="light"]{
  --h-bg:#FAF9F6;--h-panel:#FFFFFF;--h-raised:#F5F2EC;--h-line:#E8E3DA;--h-line2:#D6CFC3;
  --h-text:#211D18;--h-dim:#6F685D;--h-faint:#A29A8C;
  --h-ink:#FFFFFF;--h-good:#5C7A2E;--h-warn:#8A6216;--h-bad:#A8452F;--h-vit:#4B4BC2;
  color-scheme:light;
}
.h-body{background:var(--h-bg);color:var(--h-text);font-family:var(--h-sans);overflow:hidden}
.h-shell{display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:1fr;height:100vh;overflow:hidden}
@media (max-width:880px){ .h-shell{grid-template-columns:1fr} }
[data-rail]{display:none}
@media (max-width:880px){ [data-rail]{display:none !important} }
/* rail */
.h-rail{display:flex;flex-direction:column;min-height:0;background:var(--h-panel);border-right:1px solid var(--h-line);padding:0 10px 10px}
.h-rail-head{display:flex;align-items:center;gap:9px;padding:15px 6px 12px}
.h-seal{width:25px;height:25px;border-radius:5px;background:var(--h-text);color:var(--h-bg);display:grid;place-items:center;flex:none}
.h-seal svg{width:15px;height:15px}
.h-wordmark{display:flex;flex-direction:column;line-height:1.12}
.h-wordmark b{font-family:var(--h-serif);font-size:16px;font-weight:600;letter-spacing:.01em}
.h-wordmark small{font-size:10px;color:var(--h-dim);letter-spacing:.08em}
.h-search{display:flex;align-items:center;gap:8px;height:32px;padding:0 9px;margin:2px 0 10px;border:1px solid var(--h-line);border-radius:7px;color:var(--h-dim);font-size:12px;background:var(--h-raised)}
.h-search kbd{margin-left:auto;font-family:var(--h-mono);font-size:10px;color:var(--h-faint);border:1px solid var(--h-line);border-radius:4px;padding:1px 4px}
.h-rail-scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:1px;scrollbar-width:thin}
.h-group{font-family:var(--h-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--h-faint);padding:14px 8px 5px}
.h-nav{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:6px;font-size:12.5px;color:var(--h-dim);position:relative;text-align:left;width:100%}
.h-nav svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5}
.h-nav:hover{background:var(--h-raised);color:var(--h-text)}
.h-nav.is-active{background:var(--h-raised);color:var(--h-text);font-weight:600}
.h-nav.is-active::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--h-vit)}
.h-count{margin-left:auto;font-family:var(--h-mono);font-size:10.5px;color:var(--h-dim);min-width:16px;text-align:right}
.h-count.tone-warn{color:var(--h-warn)} .h-count.tone-bad{color:var(--h-bad)}
.h-rail-foot{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--h-line)}
.h-health{display:flex;gap:7px;flex-wrap:wrap;padding:0 4px}
.h-dot{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--h-dim)}
.h-dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--h-faint)}
.h-dot.good::before{background:var(--h-good)} .h-dot.warn::before{background:var(--h-warn)} .h-dot.bad::before{background:var(--h-bad)}
.h-theme{margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border:1px solid var(--h-line);border-radius:999px;font-size:11px;color:var(--h-dim)}
.h-theme svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6}
.h-main{display:flex;flex-direction:column;min-width:0;min-height:0}
/* topbar */
.h-topbar{display:flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-bottom:1px solid var(--h-line);flex:none;background:var(--h-bg);z-index:5}
.h-crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--h-faint);white-space:nowrap;overflow:hidden}
.h-crumbs b{color:var(--h-text);font-weight:600}
.h-topbar .sp{flex:1}
.h-btn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:7px;font-size:12.5px;font-weight:500;border:1px solid var(--h-line2);color:var(--h-text);white-space:nowrap}
.h-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.h-btn:hover{background:var(--h-raised)}
.h-btn.primary{background:var(--h-text);border-color:var(--h-text);color:var(--h-bg)}
.h-btn.primary:hover{opacity:.9}
.h-btn:disabled{opacity:.45;cursor:default}
.h-view{padding:24px 28px 40px;overflow:auto;flex:1;min-height:0;position:relative}
.h-view-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.h-h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.h-h1 .idx{font-family:var(--h-mono);font-size:11px;color:var(--h-faint);margin-right:8px;font-weight:500;vertical-align:2px}
.h-lead{margin:6px 0 0;color:var(--h-dim);font-size:13px}
.h-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* surfaces */
.h-card{background:var(--h-panel);border:1px solid var(--h-line);border-radius:10px}
.h-card-h{display:flex;align-items:center;gap:8px;padding:12px 15px;border-bottom:1px solid var(--h-line)}
.h-card-h h3{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.02em}
.h-card-h .r{margin-left:auto;display:flex;align-items:center;gap:8px}
.h-card-b{padding:14px 15px}
.h-sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.h-sec h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.02em}
.h-sec .line{flex:1;height:1px;background:var(--h-line)}
/* chips */
.h-chip{display:inline-flex;align-items:center;gap:6px;height:21px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.h-chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.9;flex:none}
.h-chip.good{color:var(--h-good);background:color-mix(in srgb,var(--h-good) 12%,transparent)}
.h-chip.warn{color:var(--h-warn);background:color-mix(in srgb,var(--h-warn) 12%,transparent)}
.h-chip.bad{color:var(--h-bad);background:color-mix(in srgb,var(--h-bad) 12%,transparent)}
.h-chip.neutral{color:var(--h-dim);background:var(--h-raised);border-color:var(--h-line)}
.h-chip.vit{color:var(--h-vit);background:color-mix(in srgb,var(--h-vit) 12%,transparent)}
.h-chip.plain::before{display:none}
.h-mono{font-family:var(--h-mono);font-size:11.5px;color:var(--h-dim)}
.h-path{font-family:var(--h-mono);font-size:11px;color:var(--h-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr}
.h-muted{color:var(--h-dim)}
/* rows / table */
.h-table{width:100%;border-collapse:separate;border-spacing:0}
.h-table th{text-align:left;font-family:var(--h-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--h-faint);font-weight:500;padding:0 12px 8px;border-bottom:1px solid var(--h-line)}
.h-table td{padding:9px 12px;border-bottom:1px solid var(--h-line);font-size:12.5px;vertical-align:middle}
.h-table tbody tr{cursor:pointer}
.h-table tbody tr:hover td{background:var(--h-raised)}
.h-table tbody tr.is-sel td{background:color-mix(in srgb,var(--h-vit) 9%,transparent)}
.h-table tr:last-child td{border-bottom:0}
/* checkbox */
.h-cb{appearance:none;width:15px;height:15px;border:1px solid var(--h-line2);border-radius:4px;background:transparent;display:inline-grid;place-items:center;cursor:pointer;margin:0;flex:none}
.h-cb:checked{background:var(--h-text);border-color:var(--h-text)}
.h-cb:checked::after{content:"";width:8px;height:4px;border-left:1.8px solid var(--h-bg);border-bottom:1.8px solid var(--h-bg);transform:rotate(-45deg) translateY(-1px)}
.h-switch{position:relative;width:30px;height:17px;border-radius:999px;background:var(--h-line2);cursor:pointer;flex:none;transition:background .15s}
.h-switch::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--h-panel);transition:transform .15s}
.h-switch.on{background:var(--h-text)}
.h-switch.on::after{transform:translateX(13px)}
/* toast */
.h-toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:50;align-items:flex-end}
.h-toast{display:flex;align-items:center;gap:9px;max-width:420px;padding:10px 13px;border-radius:8px;font-size:12.5px;border:1px solid var(--h-line2);box-shadow:0 12px 32px rgba(0,0,0,.35)}
.h-toast.ok{background:var(--h-panel);color:var(--h-text);border-left:3px solid var(--h-good)}
.h-toast.warn{border-left:3px solid var(--h-warn)} .h-toast.error{border-left:3px solid var(--h-bad)}
.h-toast .x{margin-left:6px;color:var(--h-faint);font-size:14px}
/* dialog */
.h-overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--h-bg) 62%,transparent);backdrop-filter:blur(3px);z-index:40;display:grid;place-items:center;padding:24px}
.h-dialog{width:min(560px,100%);background:var(--h-panel);border:1px solid var(--h-line2);border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.h-dialog-h{padding:16px 18px 6px}
.h-dialog-h h3{margin:0;font-size:15px}
.h-dialog-h p{margin:6px 0 0;color:var(--h-dim);font-size:12.5px}
.h-dialog-b{padding:14px 18px 18px}
.h-dialog-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--h-line)}
.h-tabs{display:flex;gap:4px;border-bottom:1px solid var(--h-line);padding:0 18px}
.h-tab{height:34px;font-size:12.5px;color:var(--h-dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.h-tab.is-active{color:var(--h-text);border-bottom-color:var(--h-text);font-weight:600}
.h-tab .n{font-family:var(--h-mono);font-size:10.5px;margin-left:5px;color:var(--h-faint)}
/* drawer */
.h-drawer-mask{position:fixed;inset:0;background:color-mix(in srgb,var(--h-bg) 55%,transparent);backdrop-filter:blur(2px);z-index:38}
.h-drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,92vw);background:var(--h-panel);border-left:1px solid var(--h-line2);z-index:39;display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(0,0,0,.35)}
.h-drawer-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--h-line)}
.h-drawer-b{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.h-drawer-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--h-line)}
.h-close{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--h-dim);margin-left:auto}
.h-close:hover{background:var(--h-raised);color:var(--h-text)}
/* misc */
.h-kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:12.5px}
.h-kv dt{color:var(--h-dim)} .h-kv dd{margin:0}
.h-empty{padding:34px 16px;text-align:center;color:var(--h-dim);font-size:13px}
.h-bar{height:4px;border-radius:4px;background:var(--h-line2);overflow:hidden}
.h-bar i{display:block;height:100%;background:var(--h-text);border-radius:4px}
.h-link{color:var(--h-vit);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--h-vit) 40%,transparent)}
.h-code{font-family:var(--h-mono);font-size:11.5px;line-height:1.65;background:var(--h-raised);border:1px solid var(--h-line);border-radius:8px;padding:12px;margin:0;overflow:auto;white-space:pre}
.h-split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1100px){ .h-split{grid-template-columns:1fr} }
.h-field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--h-dim)}
.h-input{height:32px;padding:0 10px;border:1px solid var(--h-line2);border-radius:7px;background:var(--h-raised);color:var(--h-text);font-size:12.5px;outline:none;width:100%}
.h-input:focus{border-color:var(--h-text)}
.h-seg{display:inline-flex;border:1px solid var(--h-line2);border-radius:7px;overflow:hidden}
button{font:inherit;border:0;background:none;padding:0;color:inherit;cursor:pointer;line-height:normal}
input[type=checkbox]{-webkit-appearance:none;appearance:none}
.h-seg button{height:26px;padding:0 9px;font-size:11.5px;color:var(--h-dim)}
.h-seg button.is-active{background:var(--h-text);color:var(--h-bg);font-weight:600}
</style>
<style>
/* ---- DIRECTION 2 · Tanaka geometric ---- */
.d2{--paper:#EDE6D6;--paper2:#E4DCC8;--ink:#17130F;--paper-lt:#F7F3E8;
 --red:#D63B26;--black:#17130F;--moss:#5C6B3F;--blue:#2F5D8A;
 --h-ok:#5C6B3F;--h-muted:#6A6154;--h-faint:#8C8271;--h-line:#DCD3BF;--h-accent:var(--red);
 font-family:"Libre Franklin","Helvetica Neue","PingFang SC","Hiragino Sans GB",sans-serif;color:var(--ink);font-size:13.5px}
.d2[data-theme="dark"]{--paper:#171310;--paper2:#201A15;--ink:#EFE6D6;--paper-lt:#231D17;
 --red:#E85A40;--black:#0E0B09;--moss:#A9BB86;--blue:#7FA8CF;--h-muted:#A79B88;--h-faint:#7A7062;--h-line:#332C25;color-scheme:dark}
.d2 *{box-sizing:border-box}
.d2 button{font:inherit;border:0;background:none;padding:0;color:inherit;cursor:pointer;line-height:normal}
.d2 .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.02em}
.d2 .sc{display:grid;grid-template-columns:auto 1fr;min-height:100vh}
/* spine */
.d2 .spine{background:var(--paper2);border-right:1.5px solid var(--ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 0 16px;width:104px;z-index:6}
.d2 .mark{width:56px;height:56px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;border:1.5px solid var(--ink)}
.d2 .mark i{border:.75px solid var(--ink);display:block}
.d2 .mark i:nth-child(1){background:var(--red)}
.d2 .mark i:nth-child(2){background:var(--ink)}
.d2 .mark i:nth-child(3){background:var(--ink);border-radius:0 0 100% 0}
.d2 .mark i:nth-child(4){background:var(--paper-lt)}
.d2 .vtitle{margin-top:18px;writing-mode:vertical-rl;font-family:"Noto Serif SC","Songti SC",serif;font-weight:700;font-size:19px;letter-spacing:.14em;word-break:keep-all}
.d2 .vsub{margin-top:8px;writing-mode:vertical-rl;font-size:10px;letter-spacing:.28em;color:var(--h-muted)}
.d2 .spine .sp{flex:1}
.d2 .vnav{display:flex;flex-direction:column;gap:14px;align-items:center;margin-bottom:16px}
.d2 .vnav button{writing-mode:vertical-rl;font-size:12.5px;letter-spacing:.16em;color:var(--h-muted);position:relative;padding:2px 3px;white-space:nowrap}
.d2 .vnav button:hover{color:var(--ink)}
.d2 .vnav button.on{color:var(--ink);font-weight:700}
.d2 .vnav button.on::after{content:"";position:absolute;right:-7px;top:4px;bottom:4px;width:3px;background:var(--red)}
.d2 .theme-b{border:1.5px solid var(--ink);width:38px;height:38px;display:grid;place-items:center}
.d2 .theme-b svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:1.6}
/* head */
.d2 .head{display:flex;align-items:flex-end;gap:22px;border-bottom:1.5px solid var(--ink);padding:30px 40px 16px}
.d2 .head .t{font-family:"Noto Serif SC","Songti SC",serif;font-weight:900;font-size:38px;line-height:1;letter-spacing:.02em;margin:0}
.d2 .head .lead{font-size:12.5px;color:var(--h-muted);max-width:440px;line-height:1.6}
.d2 .head .sp{flex:1}
.d2 .stamp{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;color:var(--red);border:1.5px solid var(--red);font-family:"Noto Serif SC",serif;font-weight:900;font-size:15px;line-height:1.05;text-align:center;letter-spacing:0}
.d2 .act{display:flex;gap:8px}
.d2 .btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1.5px solid var(--ink);font-size:12.5px;font-weight:600;white-space:nowrap;background:transparent}
.d2 .btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.d2 .btn:hover{background:var(--paper-lt)}
.d2 .btn.solid{background:var(--ink);color:var(--paper)}
.d2 .btn.gap-only{color:var(--h-muted);border-color:transparent}
.d2 .btn:disabled{opacity:.4;cursor:default}
.d2 .body{padding:0 40px 56px}
.d2 .secl{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--h-muted);font-family:"JetBrains Mono",monospace;margin:26px 0 10px;display:flex;gap:10px;align-items:center}
.d2 .secl::after{content:"";flex:1;height:1px;background:var(--h-line)}
/* info table on the right */
.d2 .info{border-left:1px solid var(--h-line);padding-left:14px}
.d2 .info b{display:block;color:var(--red);font-size:11px;letter-spacing:.12em;margin:0 0 3px;font-weight:700}
.d2 .info p{margin:0 0 12px;font-size:12.5px;line-height:1.55}
/* cells */
.d2 .grid3{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink)}
.d2 .cell{padding:16px 18px;border-right:1.5px solid var(--ink);position:relative;min-height:104px}
.d2 .cell:last-child{border-right:0}
.d2 .cell .n{font-family:"Libre Franklin",sans-serif;font-weight:800;font-size:40px;line-height:.95;letter-spacing:-.02em}
.d2 .cell .k{font-size:11.5px;color:var(--h-muted);margin-top:10px;letter-spacing:.06em}
.d2 .cell .ic{position:absolute;right:14px;top:14px;width:26px;height:26px}
.d2 .cell.r .n{color:var(--red)}
.d2 .gq{display:grid;grid-template-columns:repeat(2,1fr);border:1.5px solid var(--ink);border-top:0}
.d2 .q{padding:18px 18px;border-right:1.5px solid var(--ink);display:flex;gap:14px;align-items:flex-start}
.d2 .q:last-child{border-right:0}
.d2 .q .qmark{font-family:"Noto Serif SC",serif;font-size:22px;line-height:1;color:var(--red);font-weight:900;margin-top:2px}
.d2 .q .qt{font-size:13px;line-height:1.55}
.d2 .q .qa{margin-top:10px;display:flex;gap:6px}
.d2 .hl{display:grid;grid-template-columns:1.6fr 1fr;border:1.5px solid var(--ink)}
.d2 .hl>div{padding:18px}
.d2 .hl>div:first-child{border-right:1.5px solid var(--ink)}
.d2 .kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--h-line);font-size:12.5px}
.d2 .kv:last-child{border-bottom:0}
.d2 .kv .m{color:var(--h-muted)}
.d2 table.t2{width:100%;border-collapse:collapse}
.d2 table.t2 td:first-child{text-align:left}.d2 table.t2 th{text-align:left;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--h-muted);font-weight:500;padding:0 10px 8px;border-bottom:1.5px solid var(--ink)}
.d2 table.t2 td{padding:11px 10px;border-bottom:1px solid var(--h-line);font-size:12.5px;vertical-align:middle}
.d2 table.t2 tr:hover td{background:var(--paper2)}
.d2 table.t2 tr.sel td{background:color-mix(in srgb,var(--red) 7%,transparent)}
.d2 .tag{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 7px;font-size:10.5px;font-weight:700;letter-spacing:.06em;border:1px solid currentColor}
.d2 .tag::before{content:"";width:5px;height:5px;background:currentColor;flex:none}
.d2 .tag.ok{color:var(--moss)} .d2 .tag.warn{color:var(--h-accent,#B9812A)} .d2 .tag.bad{color:var(--red)} .d2 .tag.neu{color:var(--h-muted)}
.d2[data-theme="light"] .tag.warn{color:#8A5A12}
.d2[data-theme="dark"] .tag.warn{color:#D9A851}
.d2 .cb{-webkit-appearance:none;appearance:none;width:15px;height:15px;border:1.5px solid var(--ink);display:inline-grid;place-items:center;margin:0;cursor:pointer;background:transparent;flex:none}
.d2 .cb:checked{background:var(--red);border-color:var(--red)}
.d2 .cb:checked::after{content:"";width:7px;height:3.5px;border-left:1.8px solid #fff;border-bottom:1.8px solid #fff;transform:rotate(-45deg) translateY(-1px)}

.d2 .sw.on{background:var(--ink)} .d2 .sw.on::after{transform:translateX(11px);background:var(--paper)}
.d2 .empty{padding:30px;text-align:center;color:var(--h-muted);font-size:13px}
.d2 .toast{position:fixed;right:26px;bottom:26px;background:var(--ink);color:var(--paper);padding:11px 15px;font-size:12.5px;display:flex;gap:10px;align-items:center;border-left:4px solid var(--red);z-index:60;box-shadow:6px 6px 0 color-mix(in srgb,var(--red) 30%,transparent)}
.d2 .dlg-mask{position:fixed;inset:0;background:color-mix(in srgb,var(--paper) 55%,transparent);backdrop-filter:blur(2px);z-index:30;display:grid;place-items:center;padding:30px}
.d2 .dlg{background:var(--paper);border:1.5px solid var(--ink);width:min(940px,100%);box-shadow:10px 10px 0 var(--ink)}
.d2 .dlg h3{margin:0;font-family:"Noto Serif SC",serif;font-size:18px;display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1.5px solid var(--ink)}
.d2 .dlg .dbody{padding:16px 18px}
.d2 .dlg .dfoot{border-top:1.5px solid var(--ink);padding:12px 18px;display:flex;gap:8px;align-items:center;justify-content:flex-end}
.d2 .pre{margin:0;background:var(--paper2);border:1px solid var(--h-line);padding:12px;font-family:"JetBrains Mono",monospace;font-size:11.5px;line-height:1.65;white-space:pre-wrap}
.d2 .split2{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1.5px solid var(--ink)}
.d2 .split2>div{padding:12px}.d2 .split2>div+div{border-left:1.5px solid var(--ink)}
.d2 .seg{display:inline-flex;border:1.5px solid var(--ink)}
.d2 .seg button{height:26px;padding:0 10px;font-size:12px;color:var(--h-muted)}
.d2 .seg button.on{background:var(--ink);color:var(--paper);font-weight:700}
.d2 .fld{height:32px;border:1.5px solid var(--ink);padding:0 10px;background:var(--paper-lt);color:var(--ink);font-size:12.5px;outline:none;width:100%}
.d2 .fld:focus{border-color:var(--red)}
.d2 .bar{height:8px;border:1.5px solid var(--ink);display:flex}
.d2 .bar i{background:var(--red);display:block;height:100%}
.d2 .mkt{border:1.5px solid var(--ink);padding:12px 14px;min-width:150px;position:relative;text-align:left}
.d2 .mkt .nm{font-weight:700;font-size:14px}
.d2 .mkt .cp{font-size:10.5px;color:var(--h-muted);margin-top:4px;letter-spacing:.06em}
.d2 .mkt.on{background:var(--ink);color:var(--paper)}
.d2 .mkt.on .cp{color:var(--paper)} .d2 .mkt.on .quad{border-color:var(--paper)}
.d2 .quad{width:14px;height:14px;border:1.5px solid var(--ink);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;margin-top:10px}
.d2 .quad i{display:block}
.d2 .quad i:nth-child(1){background:var(--red)}.d2 .quad i:nth-child(2){background:currentColor}
.d2 .quad i:nth-child(3){background:currentColor}.d2 .quad i:nth-child(4){background:transparent}
.d2 .row2{display:flex;gap:10px;flex-wrap:wrap}
.d2 .statusline{display:flex;align-items:center;gap:16px;font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;color:var(--h-muted);padding:8px 40px;border-bottom:1.5px solid var(--ink);background:var(--paper2)}
.d2 .statusline .sp{flex:1}
.d2 .statusline b{color:var(--ink);font-weight:500}
.d2 .mnav{display:none}
@media (max-width:900px){
 .d2 .sc{grid-template-columns:1fr}
 .d2 .spine{display:none}
 .d2 .head{padding:20px 16px 12px;flex-wrap:wrap;gap:12px}
 .d2 .head .t{font-size:28px}
 .d2 .body{padding:0 16px 40px}
 .d2 .statusline{padding:8px 16px}
 .d2 .grid3{grid-template-columns:1fr 1fr}
 .d2 .cell:nth-child(2){border-right:0}
 .d2 .gq{grid-template-columns:1fr}
 .d2 .hl{grid-template-columns:1fr}
 .d2 .hl>div:first-child{border-right:0;border-bottom:1.5px solid var(--ink)}
 .d2 .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--paper2);border-top:1.5px solid var(--ink);z-index:20;justify-content:space-around;padding:8px 0}
 .d2 .mnav button{font-size:11px;color:var(--h-muted);display:flex;flex-direction:column;gap:3px;align-items:center}
 .d2 .mnav button.on{color:var(--ink);font-weight:700}
 .d2 .mnav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
}
</style>
</head><body><div id="app"></div>

<script type="text/plain" id="d2-tpl">
<div class="d2" :data-theme="theme">
<div class="sc">
  <aside class="spine">
    <div class="mark"><i></i><i></i><i></i><i></i></div>
    <div class="vtitle">苍鹭</div>
    <div class="vsub">HERON · SKILL ARCHIVE</div>
    <div class="sp"></div>
    <nav class="vnav">
      <button v-for="it in NAV" :key="it.id" :class="{on:view===it.id}" @click="go(it.id)">{{ it.label }}</button>
    </nav>
    <button class="theme-b" @click="toggleTheme" :title="theme==='dark'?'浅色':'深色'"><span v-html="ICON[theme==='dark'?'sun':'moon']"></span></button>
  </aside>

  <div style="min-width:0;display:flex;flex-direction:column">
    <div class="statusline">
      <span><b><span v-text="seclabel"></span></b></span><span class="sp"></span>
      <span>扫描 8 分钟前 · 3,412 目录</span><span>·</span><span>git 2.45</span><span>·</span><span>待处理 <b><span v-text="pending"></span></b></span>
    </div>

    <!-- OVERVIEW -->
    <template v-if="view==='overview'">
      <header class="head">
        <h1 class="t">概览</h1>
        <div class="lead">收拢 · 分发 · 升级，三步流水线在这里结账。今天有 <span v-text="pending"></span> 件事等你决定。</div>
        <span class="sp"></span>
        <div class="act"><button class="btn" @click="say('扫描完成：42 个 Skill · 9 个命令 · 1.1s')"><span v-html="ICON.refresh"></span>扫描本机</button><button class="btn solid" @click="say('36 个投影逐个校验完毕')"><span v-html="ICON.check"></span>校验生效</button></div>
      </header>
      <div class="body">
        <div class="grid3" style="margin-top:26px">
          <div class="cell"><span class="ic" v-html="shapes.grid"></span><div class="n">42</div><div class="k">已纳管实体</div></div>
          <div class="cell"><span class="ic" v-html="shapes.circle"></span><div class="n">4</div><div class="k">落点 · 覆盖 5 个客户端</div></div>
          <div class="cell r"><span class="ic" v-html="shapes.stripe"></span><div class="n">3</div><div class="k">待升级 / 待合并</div></div>
        </div>
        <div class="gq">
          <div class="q"><div class="qmark">问</div><div><div class="qt"><b>slides</b> 在 Cursor 里是坏链，客户端不会加载它。要重新投影，还是从 Cursor 撤掉？</div><div class="qa"><button class="btn" @click="go('doctor')">去体检</button><button class="btn gap-only" @click="say('已打开 slides 详情')">查看</button></div></div></div>
          <div class="q"><div class="qmark">问</div><div><div class="qt"><b>pdf</b> 你改过「用法」一节，上游 1.5.0 也改了同一节。要不要逐文件合并？</div><div class="qa"><button class="btn" @click="go('upgrades')">去更新</button><button class="btn gap-only" @click="say('已为你保留一份本地备份')">先备份</button></div></div></div>
        </div>
        <div class="secl">流水线三步</div>
        <div class="hl">
          <div>
            <div style="display:flex;gap:18px">
              <div v-for="(s,i) in steps" :key="i" style="flex:1">
                <div class="mono" style="color:var(--h-muted)">0{{ i+1 }}</div>
                <div style="font-family:'Noto Serif SC',serif;font-weight:700;font-size:17px;margin:6px 0 8px">{{ s.n }}</div>
                <div style="font-size:12px;color:var(--h-muted);line-height:1.6;min-height:56px">{{ s.d }}</div>
                <div class="bar" style="margin:10px 0 6px"><i :style="{width:s.p+'%',background:i===2?'var(--ink)':'var(--red)'}"></i></div>
                <div class="mono">{{ s.k }}</div>
              </div>
            </div>
          </div>
          <div class="info">
            <b>本周</b>
            <p>收拢 6 · 分发 11 · 升级 4 · 冲突 1</p>
            <b>数据目录</b>
            <p class="mono" style="word-break:break-all">~/Library/Application Support/Heron</p>
            <b>备份</b>
            <p>最近一次 今天 09:12，可回滚</p>
            <div style="display:flex;gap:8px"><button class="btn">回滚…</button><button class="btn gap-only" @click="go('settings')">设置</button></div>
          </div>
        </div>
        <div class="secl">最近改动</div>
        <table class="t2"><tbody>
          <tr v-for="(a,i) in activity" :key="i"><td style="width:78px"><span class="tag neu">{{ a.k }}</span></td><td><b>{{ a.s }}</b> <span style="color:var(--h-muted)">{{ a.d }}</span></td><td class="mono" style="width:110px;color:var(--h-muted)">{{ a.t }}</td><td style="width:60px;text-align:right"><button class="btn gap-only" v-if="i===0" @click="say('已撤销最后一次操作')">撤销</button></td></tr>
        </tbody></table>
      </div>
    </template>

    <!-- LIBRARY -->
    <template v-else-if="view==='library'">
      <header class="head">
        <h1 class="t">我的 Skill</h1>
        <div class="lead">一份实体，多个落点。每个客户端看到的是同一份内容的链接，改一处即全部生效。</div>
        <span class="sp"></span>
        <div class="act"><div class="seg"><button :class="{on:libView==='table'}" @click="libView='table'">列表</button><button :class="{on:libView==='grid'}" @click="libView='grid'">网格</button></div><button class="btn solid" :disabled="!selected.length" @click="dialog='project'">投影到…<span v-if="selected.length" class="mono">({{selected.length}})</span></button></div>
      </header>
      <div class="body">
        <div style="display:flex;gap:10px;margin:22px 0 14px;align-items:center;flex-wrap:wrap">
          <input class="fld" v-model="query" placeholder="按名称、描述搜索" style="max-width:280px;border-color:var(--ink)">
          <div class="seg"><button :class="{on:filter==='all'}" @click="filter='all'">全部 {{ SKILLS.length }}</button><button :class="{on:filter==='issues'}" @click="filter='issues'">有问题 3</button></div>
          <span style="flex:1"></span><span class="mono" style="color:var(--h-muted)">按 slug 排序</span>
        </div>
        <template v-if="libView==='table'">
        <table class="t2">
          <thead><tr><th style="width:34px"><input type="checkbox" class="cb" :checked="selected.length===visibleSkills.length&&visibleSkills.length>0" @change="selected=selected.length?[]:visibleSkills.map(s=>s.slug)"></th><th>Skill</th><th>版本</th><th>来源</th><th>Claude</th><th>Codex</th><th>Cursor</th><th>opencode</th></tr></thead>
          <tbody>
            <tr v-for="s in visibleSkills" :key="s.slug" :class="{sel:selected.includes(s.slug)}" @click="drawer=s.slug" style="cursor:pointer">
              <td @click.stop><input type="checkbox" class="cb" :checked="selected.includes(s.slug)" @change="toggleSel(s.slug)"></td>
              <td><b>{{ s.slug }}</b><div style="color:var(--h-muted);font-size:11.5px;margin-top:2px">{{ s.desc }}</div></td>
              <td class="mono">{{ s.ver }}</td><td class="mono">{{ s.origin }}</td>
              <td v-for="c in CLIENTS" :key="c"><span class="tag" :class="VIS_TONE[visOf(s,c)]" :title="VIS_LABEL[visOf(s,c)]">{{ VIS_SHORT[visOf(s,c)] }}</span></td>
            </tr>
          </tbody>
        </table>
        </template>
        <div v-else style="display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink)">
          <div v-for="(s,i) in visibleSkills" :key="s.slug" @click="drawer=s.slug" style="padding:16px;cursor:pointer;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)" :style="{marginRight:(i%3===2)?'-1.5px':'0',marginBottom:'-1.5px'}">
            <div style="display:flex;align-items:baseline;gap:8px"><b style="font-size:15px">{{ s.slug }}</b><span class="mono" style="margin-left:auto;color:var(--h-muted)">{{ s.ver }}</span></div>
            <p style="font-size:12px;color:var(--h-muted);line-height:1.6;min-height:40px;margin:8px 0 12px">{{ s.desc }}</p>
            <div style="display:flex;gap:5px;flex-wrap:wrap"><span v-for="c in CLIENTS" :key="c" class="tag" :class="VIS_TONE[visOf(s,c)]">{{ c }}</span></div>
          </div>
        </div>
      </div>
    </template>

    <!-- DISCOVER -->
    <template v-else-if="view==='discover'">
      <header class="head">
        <h1 class="t">发现</h1>
        <div class="lead">磁盘上有、但苍鹭还没接管的 {{ DETECTED.length }} 处。收拢会先备份，原位置默认改成链接。</div>
        <span class="sp"></span>
        <div class="act"><label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--h-muted)"><span class="sw" :class="{on:adoptKeep}" @click.prevent="adoptKeep=!adoptKeep"></span>保留原位置</label><button class="btn solid" :disabled="!selected.length" @click="dialog='adopt'">收拢所选<span v-if="selected.length" class="mono">({{selected.length}})</span></button></div>
      </header>
      <div class="body">
        <table class="t2" style="margin-top:22px">
          <thead><tr><th style="width:34px"><input type="checkbox" class="cb" @change="selected=selected.length?[]:DETECTED.filter(d=>d.kind!=='nested-suspect').map(d=>d.path)"></th><th>路径</th><th>客户端</th><th>类型</th><th>frontmatter</th><th></th></tr></thead>
          <tbody>
            <tr v-for="d in DETECTED" :key="d.path" :class="{sel:selected.includes(d.path)}">
              <td><input type="checkbox" class="cb" :disabled="d.kind==='nested-suspect'" :checked="selected.includes(d.path)" @change="selected=selected.includes(d.path)?selected.filter(p=>p!==d.path):[...selected,d.path]"></td>
              <td class="mono" style="color:var(--ink)">{{ d.path }}</td>
              <td>{{ d.client }}</td>
              <td><span class="tag" :class="d.kind==='skill'?'neu':d.kind==='legacy-command'?'warn':'bad'">{{ KIND_LABEL[d.kind] }}</span></td>
              <td><span v-if="d.fm===false" class="tag warn">需修复</span><span v-else class="mono" style="color:var(--h-muted)">ok</span></td>
              <td style="text-align:right"><button class="btn" style="height:26px" v-if="d.kind==='nested-suspect'" @click="say('已忽略：只记录，不改动','warn')">忽略</button><button class="btn" style="height:26px" v-else @click="selected=[d.path];dialog='adopt'">收拢</button></td>
            </tr>
          </tbody>
        </table>
        <p class="mono" style="color:var(--h-muted);margin-top:14px">※ 病态嵌套只报告，不会自动改动。</p>
      </div>
    </template>

    <!-- SOURCES -->
    <template v-else-if="view==='sources'">
      <header class="head">
        <h1 class="t">来源与市场</h1>
        <div class="lead">可搜索的五个市场里两个能直接装；另外三个只能浏览，回来粘贴地址。</div>
      </header>
      <div class="body">
        <div class="row2" style="margin-top:22px">
          <button v-for="m in MARKETS" :key="m.id" class="mkt" :class="{on:activeMarket===m.id}" @click="activeMarket=m.id">
            <div class="nm">{{ m.name }}</div>
            <div class="cp">{{ m.cap==='indexed'?'可搜索 · 可安装':'仅浏览 · 粘贴地址' }}<span v-if="!m.on"> · 默认关</span></div>
            <div class="quad"><i></i><i></i><i></i><i></i></div>
          </button>
        </div>
        <div class="secl">搜索结果</div>
        <div style="display:flex;gap:8px;margin-bottom:14px"><input class="fld" v-model="marketQuery" style="max-width:360px;border-color:var(--ink)"><button class="btn solid">搜索</button></div>
        <table class="t2">
          <thead><tr><th>结果</th><th>版本</th><th>安装方式</th><th></th></tr></thead>
          <tbody>
            <tr v-for="i in MARKET_ITEMS" :key="i.key">
              <td><b class="mono" style="font-size:12px;color:var(--ink)">{{ i.key }}</b><div style="color:var(--h-muted);font-size:11.5px;margin-top:3px">{{ i.summary }}</div></td>
              <td class="mono">{{ i.ver }}</td><td><span class="tag ok">可安装 · git</span></td>
              <td style="text-align:right"><button class="btn" style="height:26px" @click="say('预览：将安装 1.5.0 到存储区')">预览</button> <button class="btn solid" style="height:26px" @click="say('已安装，下一步可投影')">安装</button></td>
            </tr>
          </tbody>
